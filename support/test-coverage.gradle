// Optional instrumentation of the JavaExec tests selected by the production CI job.
// Ordinary extension/native builds do not attach a coverage agent.
if (project.findProperty("testCoverage")?.toString() != "true") {
    return
}

apply plugin: "jacoco"

repositories {
    mavenCentral()
}

jacoco {
    toolVersion = "0.8.16"
}

def coverageDirectory = layout.buildDirectory.dir("test-coverage")
def coverageExecution = layout.buildDirectory.dir("jacoco")
def coverageSessions = coverageDirectory.map { it.dir("sessions") }
def coverageVersion = project.extensions.getByType(
    org.gradle.testing.jacoco.plugins.JacocoPluginExtension).toolVersion
def coverageCommit = providers.environmentVariable("GITHUB_SHA").orElse(providers.exec {
    workingDir project.projectDir
    commandLine "git", "rev-parse", "HEAD"
}.standardOutput.asText.map { it.trim() })
def coverageRun = providers.environmentVariable("FORGE_COVERAGE_RUN_ID")
    .orElse(providers.environmentVariable("GITHUB_RUN_ID")).orElse("local")

def coverageSha256 = { File value ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    value.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    return digest.digest().encodeHex().toString()
}

// Integration jobs reuse the extension build's tools from this same CI run.
// File dependencies avoid Maven resolution on every fresh target/Windows runner.
def coverageToolsBundle = providers.environmentVariable("FORGE_COVERAGE_TOOLS_BUNDLE")
def coverageToolDirectory = providers.environmentVariable("FORGE_PINNED_COVERAGE_TOOLS")
def coverageLibraries
if (coverageToolsBundle.isPresent()) {
    def bundle = file(coverageToolsBundle.get())
    def manifest = new groovy.json.JsonSlurper().parse(new File(bundle, "collection/manifest.json"))
    def metadata = new groovy.json.JsonSlurper().parse(new File(bundle, "tools.json"))
    if (manifest.schema != 1 || manifest.status != "COLLECTED" || manifest.layer != "javaexec" ||
            manifest.commit != coverageCommit.get() || manifest.run != coverageRun.get() ||
            manifest.jacocoVersion != coverageVersion || metadata.schema != 1 ||
            metadata.jacocoVersion != coverageVersion || !(metadata.files instanceof Map) ||
            metadata.files.size() < 1 || metadata.files.size() > 16) {
        throw new GradleException("Coverage tools must come from the same commit/run and JaCoCo version")
    }
    def directory = new File(bundle, "tools")
    if (!directory.isDirectory() || java.nio.file.Files.isSymbolicLink(directory.toPath()) ||
            directory.list().toList().toSet() != metadata.files.keySet()) {
        throw new GradleException("Missing or unrecorded coverage tool files")
    }
    coverageLibraries = metadata.files.collect { name, hash ->
        if (!(name ==~ /[A-Za-z0-9_.-]+\.jar/) || !(hash ==~ /[0-9a-f]{64}/)) {
            throw new GradleException("Invalid coverage tool name or digest")
        }
        def library = new File(directory, name)
        if (!library.isFile() || java.nio.file.Files.isSymbolicLink(library.toPath()) ||
                library.length() > 16 * 1024 * 1024 || coverageSha256(library) != hash) {
            throw new GradleException("Changed coverage tool: ${name}")
        }
        return library
    }
} else if (coverageToolDirectory.isPresent()) {
    def directory = file(coverageToolDirectory.get())
    coverageLibraries = file("support/ci/jacoco-tools.sha256").readLines("UTF-8").collect { entry ->
        def (hash, path) = entry.tokenize()
        def library = new File(directory, path)
        if (!library.isFile() || coverageSha256(library) != hash) {
            throw new GradleException("Missing or changed pinned coverage tool: ${path}")
        }
        return library
    }
}
if (coverageLibraries != null) {
    def agent = coverageLibraries.find { it.name == "org.jacoco.agent-${coverageVersion}.jar" }
    if (agent == null) {
        throw new GradleException("Missing coverage agent dependency")
    }
    configurations.jacocoAgent.dependencies.clear()
    configurations.jacocoAnt.dependencies.clear()
    dependencies.add("jacocoAgent", files(agent))
    dependencies.add("jacocoAnt", files(coverageLibraries))
}

// Bind every compiled class, including unloaded classes, to each invocation.
// Names and digests have an unambiguous, platform-independent encoding.
def coverageClassFingerprint = { directories ->
    def entries = new TreeMap<String, String>()
    directories.files.each { directory ->
        fileTree(directory) { include "**/*.class" }.files.each { value ->
            String name = directory.toPath().relativize(value.toPath()).toString().replace('\\', '/')
            if (entries.put(name, coverageSha256(value)) != null) {
                throw new GradleException("Duplicate coverage class: ${name}")
            }
        }
    }
    if (entries.empty) {
        throw new GradleException("Missing compiled coverage class population")
    }
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    entries.each { name, hash -> digest.update((name + "\n" + hash + "\n").getBytes("UTF-8")) }
    return digest.digest().encodeHex().toString()
}

tasks.withType(JavaExec).configureEach { task ->
    project.extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoPluginExtension).applyTo(task)
    def agent = task.extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension)
    agent.destinationFile = coverageExecution.get().file("${task.name}.exec").asFile
    agent.includes = ["ghidradwarfforge.*"]
    agent.sessionId = "forge-javaexec-" + UUID.randomUUID().toString().replace("-", "")
    doFirst {
        def marker = coverageDirectory.get().file("tasks/${task.name}.json").asFile
        marker.parentFile.mkdirs()
        marker.text = groovy.json.JsonOutput.toJson([task: task.name, complete: false]) + "\n"
        def receipt = coverageSessions.get().file("${task.name}.json").asFile
        receipt.parentFile.mkdirs()
        receipt.text = groovy.json.JsonOutput.toJson([
            schema: 1, task: task.name, session: agent.sessionId, complete: false,
            commit: coverageCommit.get(), run: coverageRun.get(),
            host: System.getProperty("os.name"), jacocoVersion: coverageVersion,
            productionFingerprint: coverageClassFingerprint(sourceSets.main.output.classesDirs),
            testFingerprint: coverageClassFingerprint(sourceSets.test.output.classesDirs)
        ]) + "\n"
    }
    doLast {
        def receipt = coverageSessions.get().file("${task.name}.json").asFile
        def record = new groovy.json.JsonSlurper().parse(receipt)
        def data = agent.destinationFile
        if (task.executionResult.get().exitValue != 0 || !data.isFile() ||
                java.nio.file.Files.isSymbolicLink(data.toPath()) ||
                data.length() == 0 || data.length() > 16 * 1024 * 1024 ||
                record.productionFingerprint != coverageClassFingerprint(sourceSets.main.output.classesDirs) ||
                record.testFingerprint != coverageClassFingerprint(sourceSets.test.output.classesDirs)) {
            throw new GradleException("Incomplete or changed JavaExec coverage invocation: ${task.name}")
        }
        record.complete = true
        record.executionSha256 = coverageSha256(data)
        receipt.text = groovy.json.JsonOutput.toJson(record) + "\n"
        def marker = coverageDirectory.get().file("tasks/${task.name}.json").asFile
        marker.text = groovy.json.JsonOutput.toJson([task: task.name, complete: true]) + "\n"
    }
}

tasks.register("testCoverageReport", org.gradle.testing.jacoco.tasks.JacocoReport) {
    group = "verification"
    description = "Reports all production Java lines, measured by this checkout's instrumented JavaExec tests"
    dependsOn classes
    executionData.from(fileTree(coverageExecution) { include "*.exec" })
    sourceDirectories.from(files("src/main/java"))
    classDirectories.from(sourceSets.main.output.classesDirs)
    reports {
        xml.required = true
        xml.outputLocation = coverageDirectory.map { it.file("coverage.xml") }
        html.required = true
        html.outputLocation = coverageDirectory.map { it.dir("html") }
        csv.required = false
    }
}

// A separate prerequisite runs even when JacocoReport would skip missing data.
tasks.register("validateTestCoverageSessions") {
    dependsOn classes, testClasses
    doLast {
        def markers = fileTree(coverageDirectory.map { it.dir("tasks") }) { include "*.json" }.files
        if (markers.empty) {
            throw new GradleException("No instrumented JavaExec tests were recorded; coverage is unavailable")
        }
        def expected = markers.collect { marker ->
            def record = new groovy.json.JsonSlurper().parse(marker)
            if (record.complete != true || record.task != marker.name.replaceFirst(/\.json$/, "")) {
                throw new GradleException("Incomplete test coverage session: ${marker.name}")
            }
            def data = coverageExecution.get().file("${record.task}.exec").asFile
            if (!data.isFile() || data.length() == 0) {
                throw new GradleException("Missing execution data for ${record.task}")
            }
            def receipt = coverageSessions.get().file("${record.task}.json").asFile
            if (!receipt.isFile()) {
                throw new GradleException("Missing JavaExec coverage receipt: ${record.task}; clean and rerun")
            }
            def session = new groovy.json.JsonSlurper().parse(receipt)
            if (session.schema != 1 || session.complete != true || session.task != record.task ||
                    !(session.session ==~ /forge-javaexec-[0-9a-f]{32}/) ||
                    session.commit != coverageCommit.get() || session.run != coverageRun.get() ||
                    session.jacocoVersion != coverageVersion ||
                    session.executionSha256 != coverageSha256(data)) {
                throw new GradleException("Invalid JavaExec coverage receipt: ${record.task}")
            }
            return data.canonicalFile
        }.toSet()
        if (expected != fileTree(coverageExecution) { include "*.exec" }.files.collect { it.canonicalFile }.toSet()) {
            throw new GradleException("Coverage execution data does not match the recorded test sessions; clean and rerun")
        }
        def receipts = fileTree(coverageSessions) { include "*.json" }.files
        if (receipts.collect { it.name }.toSet() != markers.collect { it.name }.toSet()) {
            throw new GradleException("Coverage receipts do not match the recorded test sessions")
        }
        def productionFingerprint = coverageClassFingerprint(sourceSets.main.output.classesDirs)
        def testFingerprint = coverageClassFingerprint(sourceSets.test.output.classesDirs)
        receipts.each { receipt ->
            def session = new groovy.json.JsonSlurper().parse(receipt)
            if (session.productionFingerprint != productionFingerprint || session.testFingerprint != testFingerprint) {
                throw new GradleException("Coverage classes changed between JavaExec tasks; clean and rerun")
            }
        }
    }
}

tasks.named("testCoverageReport") { dependsOn "validateTestCoverageSessions" }
// These are ordering constraints only: native/fixture JavaExec tasks still need
// their explicit CI arguments and must not be pulled into the graph implicitly.
tasks.named("validateTestCoverageSessions") { mustRunAfter tasks.withType(JavaExec) }
tasks.named("testCoverageReport") { mustRunAfter tasks.withType(JavaExec) }

// One installed headless sample has a separate denominator/report. Its bytecode
// comes from the installed release JAR, never from a different job's compilation.
def headlessDirectory = layout.buildDirectory.dir("headless-coverage")
def headlessJar = new File(System.env.GHIDRA_INSTALL_DIR ?: project.property("GHIDRA_INSTALL_DIR"),
    "Ghidra/Extensions/GhidraDwarfForge/lib/GhidraDwarfForge.jar")

tasks.register("prepareHeadlessCoverage") {
    doLast {
        copy {
            from zipTree(configurations.jacocoAgent.singleFile)
            include "jacocoagent.jar"
            into layout.buildDirectory.dir("test-coverage-tools")
        }
    }
}

tasks.register("prepareIntegrationCoverage") {
    dependsOn "prepareHeadlessCoverage"
    doLast {
        def destination = layout.buildDirectory.file("test-coverage-tools/jacoco-classpath.txt").get().asFile
        destination.parentFile.mkdirs()
        destination.text = configurations.jacocoAnt.asPath + "\n"
        def libraries = layout.buildDirectory.dir("test-coverage-tools/report-libs").get().asFile
        def inputs = configurations.jacocoAnt.files
        if (inputs.collect { it.name }.toSet().size() != inputs.size()) {
            throw new GradleException("Duplicate JaCoCo report dependency filename")
        }
        project.sync { specification ->
            specification.from(inputs)
            specification.into(libraries)
        }
        def manifest = [schema: 1, jacocoVersion: coverageVersion,
            files: inputs.sort { it.name }.collectEntries { [(it.name): coverageSha256(it)] }]
        new File(destination.parentFile, "report-libs.json").text =
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + "\n"
    }
}

tasks.register("validateHeadlessCoverage") {
    doLast {
        def receiptCheck = providers.exec {
            commandLine "python3", "-B", "src/test/coverage/headless-coverage.py",
                "--validate", "--output", headlessDirectory.get().asFile,
                "--jar", headlessJar
        }
        receiptCheck.result.get().assertNormalExitValue()
        println receiptCheck.standardOutput.asText.get()
        for (int index = 0; index < 2; index++) {
            def identityCheck = providers.exec {
                commandLine new File(System.getProperty("java.home"), "bin/java"),
                    "-Djava.io.tmpdir=" + (System.env.TMPDIR ?: System.getProperty("java.io.tmpdir")),
                    "-cp", configurations.jacocoAnt.asPath,
                    "src/test/coverage/VerifyHeadlessCoverage.java", headlessJar,
                    headlessDirectory.get().file("headless-${index}.exec").asFile,
                    "forge-headless-coverage-${index}", "--self-test"
            }
            identityCheck.result.get().assertNormalExitValue()
            println identityCheck.standardOutput.asText.get()
        }
    }
}

tasks.register("headlessCoverageReport", org.gradle.testing.jacoco.tasks.JacocoReport) {
    group = "verification"
    description = "Separate installed-exporter sample; not included in the Java test coverage badge"
    dependsOn "validateHeadlessCoverage"
    executionData.from(headlessDirectory.map { it.file("headless-0.exec") },
        headlessDirectory.map { it.file("headless-1.exec") })
    classDirectories.from(zipTree(headlessJar).matching { include "**/*.class" })
    sourceDirectories.from(files("src/main/java"))
    reports {
        xml.required = true
        xml.outputLocation = headlessDirectory.map { it.file("coverage.xml") }
        html.required = true
        html.outputLocation = headlessDirectory.map { it.dir("html") }
        csv.required = false
    }
}
