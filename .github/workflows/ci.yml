# Ignored proposal only. Root must stage reviewed sources in a never-merge trial
# at the explicit src/test/integration path below before dispatch.
name: Owned Windows replacement primitives (research only)

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    windows-primitive-observations:
        runs-on: windows-2025
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Observe only newly owned native Windows fixtures
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $parent = Join-Path $env:GITHUB_WORKSPACE 'build/test-results/windows-replacement-primitives'
                  $null = New-Item -ItemType Directory -Path $parent
                  $stdout = Join-Path $parent 'native.stdout'
                  $stderr = Join-Path $parent 'native.stderr'
                  try {
                      & ./src/test/integration/attachment-replacement-primitives/windows-replacement-experiment.ps1 `
                          -WorkspaceParent $parent 1> $stdout 2> $stderr
                  } catch {
                      $_ | Out-String | Add-Content -LiteralPath $stderr
                      throw
                  }
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: windows-replacement-primitive-observations
                  path: |
                      build/test-results/windows-replacement-primitives/*.stdout
                      build/test-results/windows-replacement-primitives/*.stderr
                      build/test-results/windows-replacement-primitives/**/evidence/*.json
                      build/test-results/windows-replacement-primitives/**/evidence/*.cs
                      build/test-results/windows-replacement-primitives/**/evidence/*.ps1
                  if-no-files-found: error
                  retention-days: 14
