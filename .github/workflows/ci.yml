name: Attachment host observations (research only)

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    linux-observations:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21
            - name: Install explicit ACL fixture tools
              run: |
                  sudo apt-get update -y
                  sudo apt-get install --no-install-recommends -y acl
            - name: Inspect owned Linux fixtures with Java and native facts
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p build/test-results/attachment-host-observations
                  python3 src/test/integration/attachment-host-observations/linux-host-observations.py \
                      --java "$JAVA_HOME/bin/java" --javac "$JAVA_HOME/bin/javac" \
                      --output-parent build/test-results/attachment-host-observations
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: attachment-host-observations-linux
                  path: |
                      build/test-results/attachment-host-observations/**/*.json
                      build/test-results/attachment-host-observations/**/*.tsv
                      build/test-results/attachment-host-observations/**/*.stdout
                      build/test-results/attachment-host-observations/**/*.stderr
                      build/test-results/attachment-host-observations/**/*.log
                      build/test-results/attachment-host-observations/**/*.bytes
                      build/test-results/attachment-host-observations/**/source/*.java
                      build/test-results/attachment-host-observations/**/source/*.py
                      build/test-results/attachment-host-observations/**/source/*.md
                  if-no-files-found: error
                  retention-days: 14

    windows-observations:
        runs-on: windows-2025
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21
            - name: Inspect owned native Windows fixtures with Java and handle facts
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $parent = Join-Path $env:GITHUB_WORKSPACE 'build/test-results/attachment-host-observations'
                  $null = New-Item -ItemType Directory -Path $parent -Force
                  & ./src/test/integration/attachment-host-observations/windows-host-observations.ps1 `
                      -WorkspaceParent $parent -Java (Join-Path $env:JAVA_HOME 'bin/java.exe') `
                      -Javac (Join-Path $env:JAVA_HOME 'bin/javac.exe')
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: attachment-host-observations-windows
                  path: |
                      build/test-results/attachment-host-observations/**/evidence/**/*.json
                      build/test-results/attachment-host-observations/**/evidence/**/*.tsv
                      build/test-results/attachment-host-observations/**/evidence/**/*.stdout
                      build/test-results/attachment-host-observations/**/evidence/**/*.stderr
                      build/test-results/attachment-host-observations/**/evidence/**/*.bytes
                      build/test-results/attachment-host-observations/**/evidence/*.java
                      build/test-results/attachment-host-observations/**/evidence/*.cs
                      build/test-results/attachment-host-observations/**/evidence/*.ps1
                  if-no-files-found: error
                  retention-days: 14
