name: Build and cross-architecture integration

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GHIDRA_ARCHIVE: ghidra_12.0.3_PUBLIC_20260210.zip
  GHIDRA_ARCHIVE_SHA256: 90d3fffb20b00030dcef8d2a24dd0f422d3a61e432b3ad43f77233ac6d667981
  GHIDRA_DOWNLOAD_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.3_build/ghidra_12.0.3_PUBLIC_20260210.zip
  LIBDWARF_VERSION: v2.3.2
  LIBDWARF_ARCHIVE: libdwarf-2.3.2.tar.xz
  LIBDWARF_ARCHIVE_SHA256: 7992e7b9019ebfabdda5773e86243517c48cf89fafed3209e853692bc9573efd
  LIBDWARF_PATCH_SHA256: b98561b3e63b76546bd2f18d81d53e188b56deb637b5e145205b3b6eedadf696
  LIBDWARF_SOURCE_COMMIT: af7b278c6aa2ae9daad94fb7f8bffdc0e9980993

jobs:

  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          mkdir -p build/test-results/workflow-lint
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          release_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fL --retry 3 "$release_url/$archive" -o "$archive"
          curl -fL --retry 3 "$release_url/actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            -o actionlint-checksums.txt
          grep "  $archive$" actionlint-checksums.txt | sha256sum -c -
          tar -xzf "$archive" actionlint
          {
            ./actionlint -version
            ./actionlint
          } 2>&1 | tee build/test-results/workflow-lint/actionlint.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workflow-lint-diagnostics
          path: build/test-results/workflow-lint/
          if-no-files-found: warn
          retention-days: 14

  native-linux:
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: 1783382400
    steps:
      - uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y \
            build-essential zlib1g-dev libzstd-dev curl xz-utils patch \
            autoconf automake libtool pkg-config patchelf

      - name: Build pinned libdwarf producer
        run: |
          set -euo pipefail
          result_directory="$PWD/build/test-results/native-linux"
          mkdir -p "$result_directory"
          curl -fL --retry 3 \
            "https://github.com/davea42/libdwarf-code/releases/download/$LIBDWARF_VERSION/$LIBDWARF_ARCHIVE" \
            -o "$LIBDWARF_ARCHIVE"
          echo "$LIBDWARF_ARCHIVE_SHA256  $LIBDWARF_ARCHIVE" | sha256sum -c -
          tar -xf "$LIBDWARF_ARCHIVE"
          cd libdwarf-2.3.2
          printf '%s\n' "$LIBDWARF_PATCH_SHA256  $GITHUB_WORKSPACE/native/libdwarf/patches/0001-preserve-aarch64-relocation-type.patch" |
            sha256sum -c -
          patch -p1 < "$GITHUB_WORKSPACE/native/libdwarf/patches/0001-preserve-aarch64-relocation-type.patch"
          ./configure --enable-shared --enable-dwarfgen --disable-static \
            --prefix="$PWD/install" 2>&1 | tee "$result_directory/configure.log"
          make -j"$(nproc)" 2>&1 | tee "$result_directory/make.log"
          make install 2>&1 | tee "$result_directory/make-install.log"
          mkdir -p ../native-out
          cp -L install/lib/libdwarf.so.2.3.2 ../native-out/
          cp -L install/lib/libdwarf.so.2 ../native-out/libdwarf.so.2
          cp -L install/lib/libdwarfp.so.2.3.2 ../native-out/
          patchelf --set-rpath "\$ORIGIN" ../native-out/libdwarfp.so.2.3.2
          readelf -d ../native-out/libdwarfp.so.2.3.2 | grep -q '(RUNPATH).*[$]ORIGIN'
          nm -D --defined-only ../native-out/libdwarfp.so.2.3.2 |
            grep -Eq '[[:space:]]T[[:space:]]+dwarf_producer_init$'
          nm -D --defined-only ../native-out/libdwarfp.so.2.3.2 |
            grep -Eq '[[:space:]]T[[:space:]]+dwarf_pro_set_default_string_form$'
          nm -D --defined-only ../native-out/libdwarfp.so.2.3.2 |
            grep -Eq '[[:space:]]T[[:space:]]+dwarf_transform_to_disk_form_a$'
          nm -D --defined-only ../native-out/libdwarf.so.2.3.2 |
            grep -Eq '[[:space:]]T[[:space:]]+dwarf_package_version$'

          compliance=../native-out/compliance/libdwarf
          mkdir -p "$compliance/licenses" "$compliance/patches" "$compliance/source"
          cp COPYING "$compliance/licenses/UPSTREAM-COPYING"
          cp src/lib/libdwarf/LGPL.txt "$compliance/licenses/LGPL-2.1.txt"
          cp src/lib/libdwarf/LIBDWARFCOPYRIGHT \
            "$compliance/licenses/LIBDWARFCOPYRIGHT"
          cp src/lib/libdwarfp/COPYING "$compliance/licenses/LIBDWARFP-COPYING"
          cp "$GITHUB_WORKSPACE/native/libdwarf/patches/0001-preserve-aarch64-relocation-type.patch" \
            "$compliance/patches/"
          cp "$GITHUB_WORKSPACE/$LIBDWARF_ARCHIVE" "$compliance/source/"
          source_manifest=$(mktemp)
          (
            cd "$compliance"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum \
              > "$source_manifest"
          )
          mv "$source_manifest" "$compliance/SOURCE-SHA256SUMS"
          {
            echo "libdwarf release: $LIBDWARF_VERSION"
            echo "source commit: $LIBDWARF_SOURCE_COMMIT"
            echo "source archive SHA-256: $LIBDWARF_ARCHIVE_SHA256"
            echo 'source patch SHA-256:'
            sha256sum "$GITHUB_WORKSPACE/native/libdwarf/patches/0001-preserve-aarch64-relocation-type.patch"
            echo 'configure: --enable-shared --enable-dwarfgen --disable-static'
            gcc --version
            echo 'SHA-256:'
            sha256sum ../native-out/*.so*
            echo 'Dependencies:'
            readelf -d ../native-out/libdwarfp.so.2.3.2
          } > ../native-out/BUILD-METADATA.txt
          cp ../native-out/BUILD-METADATA.txt "$result_directory/"

          gcc -std=c11 -Wall -Wextra -Werror \
            -Iinstall/include/libdwarf-2 \
            "$GITHUB_WORKSPACE/src/test/native/libdwarf-abi-probe.c" \
            -o "$result_directory/libdwarf-abi-probe"
          "$result_directory/libdwarf-abi-probe" | tee "$result_directory/abi-probe.log"

          cd "$GITHUB_WORKSPACE"
          mkdir native-linux-rebuild-source native-linux-rebuild
          tar -xf "$LIBDWARF_ARCHIVE" -C native-linux-rebuild-source
          cd native-linux-rebuild-source/libdwarf-2.3.2
          printf '%s\n' "$LIBDWARF_PATCH_SHA256  $GITHUB_WORKSPACE/native/libdwarf/patches/0001-preserve-aarch64-relocation-type.patch" |
            sha256sum -c -
          patch -p1 < "$GITHUB_WORKSPACE/native/libdwarf/patches/0001-preserve-aarch64-relocation-type.patch"
          ./configure --enable-shared --enable-dwarfgen --disable-static \
            --prefix="$PWD/install" > "$result_directory/rebuild-configure.log" 2>&1
          make -j"$(nproc)" > "$result_directory/rebuild-make.log" 2>&1
          make install > "$result_directory/rebuild-make-install.log" 2>&1
          cp -L install/lib/libdwarf.so.2.3.2 "$GITHUB_WORKSPACE/native-linux-rebuild/"
          cp -L install/lib/libdwarf.so.2 \
            "$GITHUB_WORKSPACE/native-linux-rebuild/libdwarf.so.2"
          cp -L install/lib/libdwarfp.so.2.3.2 "$GITHUB_WORKSPACE/native-linux-rebuild/"
          patchelf --set-rpath "\$ORIGIN" \
            "$GITHUB_WORKSPACE/native-linux-rebuild/libdwarfp.so.2.3.2"
          cd "$GITHUB_WORKSPACE"
          support/compare-native-builds.sh linux native-out native-linux-rebuild \
            "$result_directory/reproducibility.log"

      - name: Build pinned standalone DWARF validator
        run: |
          support/build-validation-dwarfdump.sh "$LIBDWARF_ARCHIVE" \
            "$PWD/validation-tool" "$PWD/build/test-results/validation-tool-build"

      - name: Validate relocated standalone checker configuration
        run: python3 src/test/integration/dwarfdump-configuration.py "$PWD/validation-tool"

      - name: Validate complete bounded diagnostics and allocation rollback
        run: |
          sources=(build/test-results/validation-tool-build/build.*/libdwarf-2.3.2)
          test "${#sources[@]}" -eq 1
          python3 src/test/integration/dwarfdump-diagnostic-capacity.py \
            "$PWD/validation-tool/bin/dwarfdump" --libdwarf-source "${sources[0]}"

      - uses: actions/upload-artifact@v7
        with:
          name: dwarfdump-linux-validation
          path: validation-tool/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-tool-build-diagnostics
          path: |
            build/test-results/validation-tool-build/**/configure.log
            build/test-results/validation-tool-build/**/patch.log
            build/test-results/validation-tool-build/**/reader-patch.log
            build/test-results/validation-tool-build/**/diagnostic-patch.log
            build/test-results/validation-tool-build/**/config.log
            build/test-results/validation-tool-build/**/make.log
            build/test-results/validation-tool-build/**/dependencies.txt
            build/test-results/validation-tool-build/**/version.txt
            build/test-results/dwarfdump-diagnostic-capacity/
            build/test-results/dwarfdump-configuration/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: libdwarf-linux-integration
          path: native-out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-linux-build-diagnostics
          path: build/test-results/native-linux/
          if-no-files-found: warn
          retention-days: 14

  native-windows:
    runs-on: windows-latest
    env:
      SOURCE_DATE_EPOCH: 1783382400
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Windows wrapper log-collision safety
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'build\test-results\native-windows' | Out-Null
          & pwsh -NoLogo -NoProfile -File .\src\test\integration\headless-wrapper.ps1 2>&1 |
            Tee-Object -FilePath 'build\test-results\native-windows\headless-wrapper.log'
          if ($LASTEXITCODE -ne 0) {
            throw "PowerShell wrapper safety checks failed with exit code $LASTEXITCODE"
          }

      - name: Install MSYS2 MinGW64 build dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            curl
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            autoconf
            automake
            libtool
            pkgconf

      - name: Build and audit pinned Windows DLLs
        run: |
          set -euo pipefail
          result_directory="$PWD/build/test-results/native-windows"
          mkdir -p "$result_directory"
          curl -fL --retry 3 \
            "https://github.com/davea42/libdwarf-code/releases/download/$LIBDWARF_VERSION/$LIBDWARF_ARCHIVE" \
            -o "$LIBDWARF_ARCHIVE"
          echo "$LIBDWARF_ARCHIVE_SHA256  $LIBDWARF_ARCHIVE" | sha256sum -c -
          tar -xf "$LIBDWARF_ARCHIVE"
          cd libdwarf-2.3.2
          printf '%s\n' "$LIBDWARF_PATCH_SHA256  $GITHUB_WORKSPACE/native/libdwarf/patches/0001-preserve-aarch64-relocation-type.patch" |
            sha256sum -c -
          patch -p1 < "$GITHUB_WORKSPACE/native/libdwarf/patches/0001-preserve-aarch64-relocation-type.patch"
          ./configure --enable-shared --enable-dwarfgen --disable-static \
            --prefix="$PWD/install" 2>&1 | tee "$result_directory/configure.log"
          make -j"$(nproc)" 2>&1 | tee "$result_directory/make.log"
          mkdir -p ../native-windows-out
          mapfile -t project_dlls < <(find src/lib -path '*/.libs/*.dll' \
            \( -name 'libdwarf-*.dll' -o -name 'libdwarfp-*.dll' \) -print)
          test "${#project_dlls[@]}" -eq 2
          cp "${project_dlls[@]}" ../native-windows-out/

          producer=$(find ../native-windows-out -maxdepth 1 -name 'libdwarfp-*.dll' -print)
          consumer=$(find ../native-windows-out -maxdepth 1 -name 'libdwarf-*.dll' \
            ! -name 'libdwarfp-*' -print)
          test -n "$producer"
          test -n "$consumer"
          nm -g "$producer" | grep -Eq '[[:space:]]T[[:space:]]+dwarf_producer_init$'
          nm -g "$producer" |
            grep -Eq '[[:space:]]T[[:space:]]+dwarf_pro_set_default_string_form$'
          nm -g "$producer" | grep -Eq '[[:space:]]T[[:space:]]+dwarf_transform_to_disk_form_a$'
          nm -g "$consumer" | grep -Eq '[[:space:]]T[[:space:]]+dwarf_package_version$'

          copy_runtime_dependencies() {
            local binary=$1 output_directory=$2 dependency lower
            while read -r dependency; do
              lower=$(printf '%s' "$dependency" | tr '[:upper:]' '[:lower:]')
              case "$lower" in
                libdwarf-*.dll|kernel32.dll|msvcrt.dll|ucrtbase.dll|ntdll.dll|\
                api-ms-win-*.dll) continue ;;
              esac
              if [[ -f "/c/Windows/System32/$dependency" ]]; then
                continue
              fi
              if [[ ! -f "/mingw64/bin/$dependency" ]]; then
                echo "unresolved non-system DLL dependency $dependency for $binary" >&2
                return 1
              fi
              cp -n "/mingw64/bin/$dependency" "$output_directory/"
            done < <(objdump -p "$binary" |
              sed -n 's/^[[:space:]]*DLL Name: //p')
          }
          copy_runtime_dependencies "$consumer" ../native-windows-out
          copy_runtime_dependencies "$producer" ../native-windows-out
          declare -A audited_dependencies=()
          while :; do
            found_new_dependency=0
            for dependency in ../native-windows-out/*.dll; do
              dependency_name=$(basename "$dependency")
              if [[ -n "${audited_dependencies[$dependency_name]+present}" ]]; then
                continue
              fi
              copy_runtime_dependencies "$dependency" ../native-windows-out
              audited_dependencies[$dependency_name]=1
              found_new_dependency=1
            done
            [[ "$found_new_dependency" -eq 1 ]] || break
          done

          runtime_compliance=../native-windows-out/compliance/windows-runtime
          mkdir -p "$runtime_compliance"
          : > "$runtime_compliance/PACKAGE-VERSIONS.txt"
          copy_package_notices() {
            local package=$1 component=$2 destination copied=0
            local license_files=()
            destination="$runtime_compliance/$component/licenses"
            mkdir -p "$destination"
            pacman -Q "$package" >> "$runtime_compliance/PACKAGE-VERSIONS.txt"
            mapfile -t license_files < <(pacman -Ql "$package" |
              awk '$2 ~ /\/share\/licenses\// { print $2 }')
            for license_file in "${license_files[@]}"; do
              if [[ -f "$license_file" ]]; then
                cp "$license_file" "$destination/$(basename "$license_file")"
                copied=$((copied + 1))
              fi
            done
            if [[ $copied -eq 0 ]]; then
              echo "no installed license files found for $package" >&2
              return 1
            fi
          }
          copy_package_notices mingw-w64-x86_64-zlib zlib
          copy_package_notices mingw-w64-x86_64-zstd zstd
          test -f ../native-windows-out/zlib1.dll
          test -f ../native-windows-out/libzstd.dll
          for bundled_dll in ../native-windows-out/*.dll; do
            bundled_name=$(basename "$bundled_dll" | tr '[:upper:]' '[:lower:]')
            case "$bundled_name" in
              libdwarf-*.dll|libdwarfp-*.dll|libzstd.dll|zlib1.dll) ;;
              *)
                echo "bundled DLL has no reviewed notice policy: $bundled_name" >&2
                exit 1
                ;;
            esac
          done
          runtime_manifest=$(mktemp)
          (
            cd "$runtime_compliance"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum \
              > "$runtime_manifest"
          )
          mv "$runtime_manifest" "$runtime_compliance/RUNTIME-SHA256SUMS"

          {
            echo "libdwarf release: $LIBDWARF_VERSION"
            echo "source commit: $LIBDWARF_SOURCE_COMMIT"
            echo "source archive SHA-256: $LIBDWARF_ARCHIVE_SHA256"
            echo 'source patch SHA-256:'
            sha256sum "$GITHUB_WORKSPACE/native/libdwarf/patches/0001-preserve-aarch64-relocation-type.patch"
            echo 'configure: --enable-shared --enable-dwarfgen --disable-static'
            echo 'Windows runtime packages:'
            cat "$runtime_compliance/PACKAGE-VERSIONS.txt"
            gcc --version
            echo 'SHA-256:'
            sha256sum ../native-windows-out/*.dll
            echo 'Dependencies:'
            for dll in ../native-windows-out/*.dll; do
              echo "$(basename "$dll")"
              objdump -p "$dll" | sed -n 's/^[[:space:]]*DLL Name: /  /p'
            done
          } > ../native-windows-out/BUILD-METADATA.txt
          cp ../native-windows-out/BUILD-METADATA.txt "$result_directory/"

          gcc -std=c11 -Wall -Wextra -Werror \
            -Isrc/lib/libdwarf -Isrc/lib/libdwarfp \
            "$GITHUB_WORKSPACE/src/test/native/libdwarf-abi-probe.c" \
            -o "$result_directory/libdwarf-abi-probe.exe"
          "$result_directory/libdwarf-abi-probe.exe" |
            tee "$result_directory/abi-probe.log"

          cd "$GITHUB_WORKSPACE"
          mkdir native-windows-rebuild-source native-windows-rebuild
          tar -xf "$LIBDWARF_ARCHIVE" -C native-windows-rebuild-source
          cd native-windows-rebuild-source/libdwarf-2.3.2
          printf '%s\n' "$LIBDWARF_PATCH_SHA256  $GITHUB_WORKSPACE/native/libdwarf/patches/0001-preserve-aarch64-relocation-type.patch" |
            sha256sum -c -
          patch -p1 < "$GITHUB_WORKSPACE/native/libdwarf/patches/0001-preserve-aarch64-relocation-type.patch"
          ./configure --enable-shared --enable-dwarfgen --disable-static \
            --prefix="$PWD/install" > "$result_directory/rebuild-configure.log" 2>&1
          make -j"$(nproc)" > "$result_directory/rebuild-make.log" 2>&1
          mapfile -t rebuilt_project_dlls < <(find src/lib -path '*/.libs/*.dll' \
            \( -name 'libdwarf-*.dll' -o -name 'libdwarfp-*.dll' \) -print)
          test "${#rebuilt_project_dlls[@]}" -eq 2
          cp "${rebuilt_project_dlls[@]}" "$GITHUB_WORKSPACE/native-windows-rebuild/"
          declare -A rebuild_audited_dependencies=()
          while :; do
            found_new_dependency=0
            for dependency in "$GITHUB_WORKSPACE"/native-windows-rebuild/*.dll; do
              dependency_name=$(basename "$dependency")
              if [[ -n "${rebuild_audited_dependencies[$dependency_name]+present}" ]]; then
                continue
              fi
              copy_runtime_dependencies "$dependency" \
                "$GITHUB_WORKSPACE/native-windows-rebuild"
              rebuild_audited_dependencies[$dependency_name]=1
              found_new_dependency=1
            done
            [[ "$found_new_dependency" -eq 1 ]] || break
          done
          cd "$GITHUB_WORKSPACE"
          support/compare-native-builds.sh windows native-windows-out \
            native-windows-rebuild "$result_directory/reproducibility.log"

      - uses: actions/upload-artifact@v7
        with:
          name: libdwarf-windows-integration
          path: native-windows-out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-windows-build-diagnostics
          path: build/test-results/native-windows/
          if-no-files-found: warn
          retention-days: 14

  extension-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Ghidra 12.0.3 archive
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ghidra-download/${{ env.GHIDRA_ARCHIVE }}
          key: ghidra-${{ env.GHIDRA_ARCHIVE_SHA256 }}

      - name: Install pinned Ghidra
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghidra-download" "$RUNNER_TEMP/ghidra"
          archive="$RUNNER_TEMP/ghidra-download/$GHIDRA_ARCHIVE"
          if [[ ! -f "$archive" ]]; then
            curl -fL --retry 3 "$GHIDRA_DOWNLOAD_URL" -o "$archive"
          fi
          echo "$GHIDRA_ARCHIVE_SHA256  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/ghidra"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra/ghidra_12.0.3_PUBLIC" >> "$GITHUB_ENV"

      - name: Build extension
        run: |
          set -euo pipefail
          ./gradlew clean
          mkdir -p build/test-results/extension-build
          {
            src/test/integration/headless-wrapper.sh
            src/test/integration/architecture-neutrality.sh
            ./gradlew addressNormalizerSmoke elfImageBaseSmoke dwarfTargetSmoke \
              ghidraTargetAgreementSmoke outputPathPolicySmoke pathTraversalSmoke \
              exportReportSmoke exportReportClaimsSmoke exportArtifactHashBindingSmoke exportReportDetailsSmoke \
              fileDigestsSmoke elfBuildIdSmoke \
              matchedElfPrefixSmoke matchedElfAllocationsSmoke executableProgramBytesSmoke \
              debuglinkCandidateContentSmoke ownedDebuglinkCandidateSmoke \
              syntheticSourceSmoke typeGraphSmoke defaultTypeIdentitySmoke \
              variableStorageSmoke registerPrefixSmoke registerAliasSmoke registerCopySmoke \
              stackFirstUseSmoke \
              opaqueRegisterEffectsSmoke qualifiedFunctionNameSmoke externalFunctionInventorySmoke \
              arm32ModeSymbolsSmoke ghidraArm32FunctionModesSmoke dynamicParameterStorageSmoke truncatedSpaceStoreSmoke \
              dwarfInfoRepairSmoke dwarfLineTableSmoke dwarfRangeListsSmoke functionEntrySmoke \
              dwarfAddressRangesSmoke \
              dwarfLocationListsSmoke artifactPairPublisherSmoke \
              packagedNativeLibrariesSmoke existingDebugSidecarSmoke \
              extendedSectionNumberingSmoke elfImageReaderSmoke \
              elfCopyCancellationSmoke ghidraImageBaseSmoke buildExtension
            src/test/integration/release-package.sh
            zipinfo -l dist/*.zip | grep -Eq \
              '^-rwxr-xr-x.*GhidraDwarfForge/support/ghidra-dwarf-forge-headless$'
          } 2>&1 | tee build/test-results/extension-build/build.log

      - uses: actions/upload-artifact@v7
        with:
          name: ghidra-dwarf-forge-extension-base
          path: dist/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extension-build-diagnostics
          path: build/test-results/extension-build/
          if-no-files-found: warn
          retention-days: 14

  release-package:
    needs: [ extension-build, native-linux, native-windows ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ghidra-dwarf-forge-extension-base
          path: base-extension

      - uses: actions/download-artifact@v8
        with:
          name: libdwarf-linux-integration
          path: native-linux

      - uses: actions/download-artifact@v8
        with:
          name: libdwarf-windows-integration
          path: native-windows

      - name: Assemble and verify reproducible release bundle
        run: |
          set -euo pipefail
          mkdir -p release build/test-results/release-package
          version=$(tr -d '\r\n' < VERSION)
          output="release/GhidraDwarfForge-$version-ghidra-12.0.3.zip"
          support/assemble-release.sh base-extension/*.zip native-linux native-windows "$output"
          support/assemble-release.sh base-extension/*.zip native-linux native-windows \
            release/rebuilt.zip
          cmp "$output" release/rebuilt.zip
          rm release/rebuilt.zip
          unzip -q "$output" -d build/test-results/release-package/unpacked
          module=build/test-results/release-package/unpacked/GhidraDwarfForge
          (cd "$module" && sha256sum -c RELEASE-SHA256SUMS)
          (cd "$module/os/linux_x86_64" && sha256sum -c SHA256SUMS)
          (cd "$module/os/win_x86_64" && sha256sum -c SHA256SUMS)
          echo "$LIBDWARF_ARCHIVE_SHA256  $module/third_party/libdwarf/source/$LIBDWARF_ARCHIVE" |
            sha256sum -c -
          echo "$LIBDWARF_PATCH_SHA256  $module/third_party/libdwarf/patches/0001-preserve-aarch64-relocation-type.patch" |
            sha256sum -c -
          test -s "$module/THIRD_PARTY_NOTICES.md"
          test -s "$module/ghidra_scripts/GhidraDwarfForge.java"
          test -s "$module/ghidra_scripts/ExportGhidraDwarfForge.java"
          test -s "$module/third_party/CORRESPONDING_SOURCE.md"
          test -s "$module/third_party/libdwarf/licenses/LGPL-2.1.txt"
          test -s "$module/third_party/windows-runtime/zlib/licenses/LICENSE"
          test -s "$module/third_party/windows-runtime/zstd/licenses/LICENSE"
          sha256sum "$output" | tee build/test-results/release-package/release.sha256
          unzip -l "$output" > build/test-results/release-package/contents.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ghidra-dwarf-forge-extension
          path: release/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-package-diagnostics
          path: build/test-results/release-package/
          if-no-files-found: warn
          retention-days: 14

  target-preflight:
    needs: [ release-package, native-linux ]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64, aarch64, arm32, mips32be, mips32le ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install target toolchain and debugger
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          packages=(gdb-multiarch llvm dwarfdump)
          case "$TARGET" in
            x86_64)
              packages+=(gcc binutils gdb qemu-user-static xvfb openbox x11-utils libxtst6 libxi6 libxrender1)
              ;;
            aarch64)
              packages+=(gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
                libc6-dev-arm64-cross qemu-user-static)
              ;;
            arm32)
              packages+=(gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
                libc6-dev-armhf-cross qemu-user-static)
              ;;
            mips32be)
              packages+=(gcc-mips-linux-gnu binutils-mips-linux-gnu
                libc6-dev-mips-cross qemu-user-static)
              ;;
            mips32le)
              packages+=(gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu
                libc6-dev-mipsel-cross qemu-user-static)
              ;;
          esac
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y "${packages[@]}"

      - name: Cache Ghidra 12.0.3 archive
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ghidra-download/${{ env.GHIDRA_ARCHIVE }}
          key: ghidra-${{ env.GHIDRA_ARCHIVE_SHA256 }}

      - name: Install pinned Ghidra
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghidra-download" "$RUNNER_TEMP/ghidra"
          archive="$RUNNER_TEMP/ghidra-download/$GHIDRA_ARCHIVE"
          if [[ ! -f "$archive" ]]; then
            curl -fL --retry 3 "$GHIDRA_DOWNLOAD_URL" -o "$archive"
          fi
          echo "$GHIDRA_ARCHIVE_SHA256  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/ghidra"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra/ghidra_12.0.3_PUBLIC" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: ghidra-dwarf-forge-extension
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: libdwarf-linux-integration
          path: native-integration

      - uses: actions/download-artifact@v8
        with:
          name: dwarfdump-linux-validation
          path: validation-tool

      - name: Verify pinned standalone DWARF validator
        run: |
          set -euo pipefail
          (cd validation-tool && sha256sum -c SHA256SUMS)
          chmod 755 validation-tool/bin/dwarfdump validation-tool/libexec/dwarfdump
          validation-tool/bin/dwarfdump --version
          echo "$PWD/validation-tool/bin" >> "$GITHUB_PATH"
          echo "DWARFDUMP=$PWD/validation-tool/bin/dwarfdump" >> "$GITHUB_ENV"

      - name: Reject incomplete and exit-zero failing validator reports
        if: matrix.target == 'x86_64'
        run: python3 src/test/integration/check-dwarfdump-test.py

      - name: Capture validator evidence and reject changed or incomplete handoffs
        if: matrix.target == 'x86_64'
        run: |
          python3 -B src/test/integration/validation-evidence-test.py \
            --bundle "$PWD/validation-tool" --llvm "$(command -v llvm-dwarfdump)" \
            --llvm-notices /usr/share/doc/llvm-18/copyright \
            --output "$PWD/build/test-results/validation-evidence-controls"

      - name: Validate extended program counts and reject malformed ELF tables
        if: matrix.target == 'x86_64'
        run: python3 src/test/integration/dwarfdump-extended-programs.py "$DWARFDUMP"

      - name: Record exact toolchain versions
        env:
          TARGET: ${{ matrix.target }}
        run: |
          src/test/integration/record-tool-versions.sh "$TARGET" \
            "build/test-results/tool-versions/$TARGET.txt"

      - name: Isolated producer ABI smoke test
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          profile="$TARGET"
          iterations=1
          if [[ "$profile" == "aarch64" ]]; then
            profile=arm64
          fi
          if [[ "$TARGET" == "x86_64" ]]; then
            iterations=64
          fi
          src/test/integration/run-isolated-native-smoke.sh \
            "build/test-results/native-producer/$TARGET" \
            ./gradlew nativeProducerSmoke \
              -PlibdwarfPath="$PWD/native-integration/libdwarf.so.2.3.2" \
              -PlibdwarfpPath="$PWD/native-integration/libdwarfp.so.2.3.2" \
              -PtargetProfile="$profile" \
              -PnativeIterations="$iterations"

      - name: Install extension
        run: unzip -q dist/*.zip -d "$GHIDRA_INSTALL_DIR/Ghidra/Extensions"

      - name: Isolated packaged-native producer smoke test
        if: matrix.target == 'x86_64'
        run: |
          set -euo pipefail
          module="$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge"
          ./gradlew packagedNativeProducerSmoke \
            -PpackagedModuleRoot="$module" \
            -PpackagedPlatform=linux_x86_64 \
            -PtargetProfile=x86_64 \
            -PnativeIterations=2

      - name: Build source fixture
        env:
          TARGET: ${{ matrix.target }}
        run: |
          make -C src/test/fixtures "$TARGET"
          src/test/integration/fixture-reproducibility.sh "$TARGET"

      - name: Verify fixture identity and stripping
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          fixture="build/fixtures/$TARGET/semantic.exec.stripped"
          readelf -h "$fixture"
          if readelf -S "$fixture" | grep -q '\.debug_'; then
            echo "stripped fixture unexpectedly contains DWARF" >&2
            exit 1
          fi
          partial="build/fixtures/$TARGET/semantic.partial.stripped"
          if readelf -S "$partial" | grep -q '\.debug_'; then
            echo "partially stripped fixture unexpectedly contains DWARF" >&2
            exit 1
          fi
          readelf -Ws "$partial" | grep -Eq '[[:space:]]recovered_add$'

      - name: Headless Ghidra preflight
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          fixture="build/fixtures/$TARGET/semantic.exec.stripped"
          before=$(sha256sum "$fixture" | cut -d' ' -f1)
          src/test/integration/headless-preflight.sh "$GHIDRA_INSTALL_DIR" "$TARGET"
          FIXTURE_SUFFIX=exec.no-sections.stripped \
            src/test/integration/headless-preflight.sh "$GHIDRA_INSTALL_DIR" "$TARGET"
          FIXTURE_SUFFIX=pie.stripped \
            src/test/integration/headless-preflight.sh "$GHIDRA_INSTALL_DIR" "$TARGET"
          after=$(sha256sum "$fixture" | cut -d' ' -f1)
          test "$before" = "$after"

      - name: Build and validate matched sidecar containers
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ./gradlew sectionlessSidecarSmoke -PfixtureTarget="$TARGET"
          result_directory="build/test-results/matched-container/$TARGET"
          mkdir -p "$result_directory"
          warnings="$result_directory/readelf.stderr"
          : > "$warnings"
          {
            for role in exec exec.no-sections pie; do
              sidecar="build/fixtures/$TARGET/semantic.$role.forge-container.dbg"
              readelf -h "$sidecar" > "$result_directory/$role.header.txt"
              readelf -S "$sidecar" > "$result_directory/$role.sections.txt"
              readelf --debug-dump=info "$sidecar" \
                > "$result_directory/$role.info.txt"
              readelf --debug-dump=abbrev "$sidecar" \
                > "$result_directory/$role.abbrev.txt"
              readelf --debug-dump=decodedline "$sidecar" \
                > "$result_directory/$role.line.txt"
              readelf -n "$sidecar" > "$result_directory/$role.notes.txt"
            done
          } 2>>"$warnings"
          if [[ -s "$warnings" ]]; then
            cat "$warnings" >&2
            exit 1
          fi

      - name: Native/QEMU GDB sidecar oracle
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for role in exec exec.no-sections pie; do
            FIXTURE_ROLE="$role" DEBUG_ARTIFACT_SUFFIX=forge-container.dbg \
              src/test/integration/qemu-gdb-oracle.sh "$TARGET"
          done

      - name: Extended ELF section tables through export and GDB
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ./gradlew extendedSectionNumberingSmoke -PfixtureTarget="$TARGET"
          src/test/integration/extended-sections-export.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2" "$TARGET"

      - name: Unnamed sections and extended program tables through export and GDB
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          java src/test/integration/ElfLayoutFixtures.java build/fixtures "$TARGET"
          src/test/integration/elf-layout-export.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2" "$TARGET"

      - name: Large ELF bounded-memory container and real exporter
        if: matrix.target == 'x86_64'
        run: |
          set -euo pipefail
          src/test/integration/large-elf-sidecar.sh
          src/test/integration/large-headless-export.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2"
          src/test/integration/copy-cancellation-export.sh "$GHIDRA_INSTALL_DIR"

      - name: Reject definite ELF and Ghidra processor disagreement
        if: matrix.target == 'x86_64' || matrix.target == 'mips32le'
        env:
          TARGET: ${{ matrix.target }}
        run: python3 src/test/integration/target-language-agreement.py "$GHIDRA_INSTALL_DIR" "$TARGET"

      - name: Headless Forge symbol export and GDB integration
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          consumer="$PWD/native-integration/libdwarf.so.2.3.2"
          producer="$PWD/native-integration/libdwarfp.so.2.3.2"
          mkdir -p "$PWD/build/test-results/validation-evidence"
          evidence_root=$(mktemp -d "$PWD/build/test-results/validation-evidence/$TARGET.XXXXXXXX")
          python3 src/test/integration/validation-evidence.py tools \
            --bundle "$PWD/validation-tool" --llvm "$(command -v llvm-dwarfdump)" \
            --llvm-notices /usr/share/doc/llvm-18/copyright \
            --output "$evidence_root/tools"
          mkdir "$evidence_root/cases"
          for role in exec partial exec.no-build-id exec.no-sections pie shared; do
              capture=()
              case "$role" in
                  exec|pie|exec.no-build-id)
                      capture=("FORGE_VALIDATION_EVIDENCE_DIR=$evidence_root/cases/$role"
                          "FORGE_VALIDATION_TOOLSET=$evidence_root/tools/toolset.json") ;;
              esac
              env "${capture[@]}" FIXTURE_ROLE="$role" src/test/integration/headless-symbol-export.sh \
                  "$GHIDRA_INSTALL_DIR" "$consumer" "$producer" "$TARGET"
              if [[ "$role" == "exec.no-sections" ]]; then
                  python3 src/test/integration/sectionless-load-ranges.py \
                      "$PWD/build/fixtures/$TARGET/semantic.exec.no-sections.stripped" \
                      "$PWD/build/fixtures/$TARGET/semantic.exec.no-sections.ghidra-forge.dbg" \
                      --tool "$DWARFDUMP"
              fi
              if [[ "$role" == "shared" ]]; then
                  if [[ "$TARGET" == mips32le ]]; then
                      src/test/integration/shared-object-port-collision.py "$TARGET"
                  else
                      src/test/integration/shared-object-gdb.sh "$TARGET"
                  fi
              else
                  FIXTURE_ROLE="$role" src/test/integration/qemu-gdb-symbols.sh "$TARGET"
              fi
              if [[ "$TARGET:$role" == "x86_64:exec" ]]; then
                  sidecar="build/fixtures/x86_64/semantic.exec.ghidra-forge.dbg"
                  source_file="$sidecar.c"
                  first=$(sha256sum "$sidecar" | cut -d' ' -f1)
                  first_source=$(sha256sum "$source_file" | cut -d' ' -f1)
                  FIXTURE_ROLE="exec" src/test/integration/headless-symbol-export.sh \
                      "$GHIDRA_INSTALL_DIR" "$consumer" "$producer" x86_64
                  second=$(sha256sum "$sidecar" | cut -d' ' -f1)
                  second_source=$(sha256sum "$source_file" | cut -d' ' -f1)
                  test "$first" = "$second"
                  test "$first_source" = "$second_source"
                  src/test/integration/controlled-decompiler-failure.sh \
                      "$GHIDRA_INSTALL_DIR" "$consumer" "$producer"
              fi
          done
          python3 src/test/integration/validation-evidence.py index --target "$TARGET" \
            --capture "exec=$evidence_root/cases/exec/receipt.json" \
            --capture "pie=$evidence_root/cases/pie/receipt.json" \
            --capture "exec.no-build-id=$evidence_root/cases/exec.no-build-id/receipt.json" \
            --output "$evidence_root/index.json"
          echo "FORGE_VALIDATION_EVIDENCE_INDEX=$evidence_root/index.json" >> "$GITHUB_ENV"

      # Consume primary export reports before later x86 regressions reuse their log paths.
      - name: Streamed file digests and target-endian GNU debuglink CRC
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$TARGET" == x86_64 ]]; then
            extra+=(--large)
          fi
          python3 src/test/integration/file-digests.py \
            "$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge" \
            "$TARGET" "${extra[@]}"

      - name: Typed ELF build-ID observations and independent GNU note oracle
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 src/test/integration/elf-build-id.py \
            "$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge" "$TARGET"

      - name: Read-only export report claims and independent JSON oracle
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 src/test/integration/export-report-claims.py \
            "$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge" "$TARGET" \
            --handoff-manifest "$PWD/build/test-results/report-handoff/$TARGET.json" \
            --validation-evidence "$FORGE_VALIDATION_EVIDENCE_INDEX"

      - name: Retained ELF prefix observations and independent byte oracle
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$TARGET" == x86_64 ]]; then
            extra+=(--large)
          fi
          python3 src/test/integration/matched-elf-prefix.py \
            "$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge" \
            "$TARGET" "${extra[@]}"

      - name: Active ELF allocation metadata and independent indexed oracle
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$TARGET" == x86_64 ]]; then
            extra+=(--large)
          fi
          python3 src/test/integration/matched-elf-allocations.py \
            "$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge" \
            "$TARGET" "${extra[@]}"

      - name: Selected artifact SHA claims and independent streamed hash oracle
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$TARGET" == x86_64 ]]; then
            extra+=(--large)
          fi
          python3 src/test/integration/export-artifact-hash-binding.py \
            "$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge" \
            "$TARGET" "${extra[@]}"

      - name: QEMU private socket startup and failure cleanup
        if: matrix.target == 'x86_64'
        run: src/test/integration/qemu-socket-startup.sh

      - name: Saved-program type identity across fresh headless processes
        if: matrix.target == 'x86_64'
        run: src/test/integration/saved-program-determinism.sh "$GHIDRA_INSTALL_DIR"

      - name: Validate line sequences and reject malformed range artifacts
        if: matrix.target == 'x86_64'
        run: |
          python3 src/test/integration/dwarfdump-line-sequences.py "$DWARFDUMP" \
            --forge-fixture "$PWD/build/fixtures/x86_64/semantic.exec.ghidra-forge.dbg" \
            --forge-original "$PWD/build/fixtures/x86_64/semantic.exec.stripped"

      - name: Bit-field values through the real exporter and GDB
        env:
          TARGET: ${{ matrix.target }}
        run: src/test/integration/bitfield-values-export.sh "$GHIDRA_INSTALL_DIR" "$TARGET"

      - name: Function-owned statics and duplicate-name lookup
        env:
          TARGET: ${{ matrix.target }}
        run: src/test/integration/function-static-scopes-export.sh "$GHIDRA_INSTALL_DIR" "$TARGET"

      - name: Qualified analyst function names and owned statics
        env:
          TARGET: ${{ matrix.target }}
          FORGE_SCOPE_QUALIFIED: '1'
        run: src/test/integration/function-static-scopes-export.sh "$GHIDRA_INSTALL_DIR" "$TARGET"

      - name: Incoming register lifetime before overwrite
        if: matrix.target == 'x86_64' || matrix.target == 'aarch64'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          src/test/integration/register-prefix-export.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2" "$TARGET"

      - name: Opaque supervisor-call register effects remain unavailable
        if: matrix.target == 'aarch64'
        run: src/test/integration/opaque-register-effects-export.sh "$GHIDRA_INSTALL_DIR"

      - name: Proven parameter register copies and unavailable tails
        if: matrix.target == 'x86_64' || matrix.target == 'aarch64'
        env:
          TARGET: ${{ matrix.target }}
        run: src/test/integration/register-copy-export.sh "$GHIDRA_INSTALL_DIR" "$TARGET"

      - name: Unsupported stack first-use and retained zero-offset locals
        if: matrix.target == 'x86_64' || matrix.target == 'aarch64'
        env:
          TARGET: ${{ matrix.target }}
        run: src/test/integration/stack-first-use-export.sh "$GHIDRA_INSTALL_DIR" "$TARGET"

      - name: Nonzero load-segment file offset and explicit rebase
        if: matrix.target == 'x86_64'
        run: |
          src/test/integration/nonzero-load-offset-export.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2"

      - name: Recovered ARM and Thumb instruction modes
        if: matrix.target == 'arm32'
        run: src/test/integration/arm-thumb-mode-export.sh "$GHIDRA_INSTALL_DIR"

      - name: Saved dynamic parameter storage and debugger values
        env:
          TARGET: ${{ matrix.target }}
        run: src/test/integration/dynamic-parameter-storage-export.sh "$GHIDRA_INSTALL_DIR" "$TARGET"

      - name: MIPS ordinary and truncated memory-space stores
        if: matrix.target == 'mips32be' || matrix.target == 'mips32le'
        env:
          TARGET: ${{ matrix.target }}
        run: src/test/integration/mips-truncated-space-export.sh "$GHIDRA_INSTALL_DIR" "$TARGET"

      - name: ARM per-function dynamic base and VFP parameters
        if: matrix.target == 'arm32'
        run: src/test/integration/arm-dynamic-pcs-export.sh "$GHIDRA_INSTALL_DIR"

      - name: Isolated scalar register bit-piece producer
        if: matrix.target == 'arm32'
        run: |
          results="$PWD/build/test-results/floating-register-slice-native"
          mkdir -p "$results"
          src/test/integration/run-isolated-native-smoke.sh "$results" \
            ./gradlew floatingRegisterSliceSmoke \
            -PlibdwarfPath="$PWD/native-integration/libdwarf.so.2.3.2" \
            -PlibdwarfpPath="$PWD/native-integration/libdwarfp.so.2.3.2" \
            -PsidecarInput="$PWD/build/fixtures/arm32/semantic.exec.stripped" \
            -PsidecarOutput="$results/slice.dbg"
          readelf --debug-dump=info "$results/slice.dbg" >"$results/info.txt" \
            2>"$results/readelf.stderr"
          test ! -s "$results/readelf.stderr"
          grep -Fq 'DW_OP_bit_piece: size: 32 offset: 32' "$results/info.txt"
          llvm-dwarfdump --verify "$results/slice.dbg" >"$results/llvm.txt" 2>&1
          python3 src/test/integration/check-dwarfdump.py \
            "$results/slice.dbg" "$results/dwarfdump.txt" \
            --original "$PWD/build/fixtures/arm32/semantic.exec.stripped"

      - name: Scalar floating registers and conservative paired omissions
        env:
          TARGET: ${{ matrix.target }}
        run: |
          src/test/integration/floating-registers-export.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2" "$TARGET"

      - name: Function entry producer and validators
        env:
          TARGET: ${{ matrix.target }}
        run: |
          results="$PWD/build/test-results/function-entry-native/$TARGET"
          mkdir -p "$results"
          src/test/integration/run-isolated-native-smoke.sh "$results" \
            ./gradlew functionEntrySmoke \
            -PlibdwarfPath="$PWD/native-integration/libdwarf.so.2.3.2" \
            -PlibdwarfpPath="$PWD/native-integration/libdwarfp.so.2.3.2" \
            -PsidecarInput="$PWD/build/fixtures/$TARGET/semantic.exec.stripped" \
            -PsidecarOutput="$results/entry.dbg"
          readelf --debug-dump=info "$results/entry.dbg" >"$results/info.txt" \
            2>"$results/readelf.stderr"
          test ! -s "$results/readelf.stderr"
          test "$(grep -c DW_AT_entry_pc "$results/info.txt")" -eq 2
          llvm-dwarfdump --verify "$results/entry.dbg" >"$results/llvm.txt" 2>&1
          python3 src/test/integration/check-dwarfdump.py \
            "$results/entry.dbg" "$results/dwarfdump.txt" \
            --original "$PWD/build/fixtures/$TARGET/semantic.exec.stripped"

      - name: True function entry below-entry body ranges and rebases
        if: matrix.target == 'x86_64'
        run: |
          src/test/integration/function-entry-export.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2"

      - name: Existing compiler DWARF replacement
        if: matrix.target == 'x86_64'
        run: |
          src/test/integration/existing-debug-export.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2"

      - name: Real-world distro binary export and debugging
        if: matrix.target == 'x86_64'
        run: src/test/integration/real-world-export.sh "$GHIDRA_INSTALL_DIR"

      - name: Published source and sidecar timestamp regression
        if: matrix.target == 'x86_64'
        run: src/test/integration/artifact-pair-timestamps.sh

      - name: GUI output chooser selection and cancellation
        if: matrix.target == 'x86_64'
        run: |
          src/test/integration/gui-output-fallback.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge" \
            "$PWD/build/fixtures/x86_64/semantic.exec.stripped" \
            "$PWD/build/fixtures/x86_64/semantic.exec.reference"

      - name: Installed Script Manager discovery, export, console, and cancellation
        if: matrix.target == 'x86_64'
        run: |
          src/test/integration/gui-script-manager.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge" \
            "$PWD/build/fixtures/x86_64/semantic.exec.stripped" \
            "$PWD/build/fixtures/x86_64/semantic.exec.reference"

      - name: Clean installed-release export without external natives
        if: matrix.target == 'x86_64'
        run: |
          set -euo pipefail
          fixture="$PWD/build/fixtures/x86_64/semantic.exec.stripped"
          result_directory="$PWD/build/test-results/packaged-release"
          output="$result_directory/semantic.exec.packaged.dbg"
          log="$result_directory/headless.log"
          wrapper="$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge/support/ghidra-dwarf-forge-headless"
          mkdir -p "$result_directory"
          before=$(sha256sum "$fixture" | cut -d' ' -f1)
          "$wrapper" --ghidra-dir="$GHIDRA_INSTALL_DIR" --import="$fixture" \
            --output="$output" --log="$log"
          after=$(sha256sum "$fixture" | cut -d' ' -f1)
          test "$before" = "$after"
          grep -Fq 'native policy: verified packaged libraries' "$log"
          test -s "$output"
          test -s "$output.c"
          readelf -h "$output"
          readelf -S "$output"
          readelf --debug-dump=info "$output"
          readelf --debug-dump=abbrev "$output"
          readelf --string-dump=.debug_str "$output" | grep -q GhidraDwarfForge
          readelf --debug-dump=decodedline "$output"
          llvm-dwarfdump --verify "$output"
          python3 src/test/integration/check-dwarfdump.py "$output" \
            "$PWD/build/test-results/clean-install/dwarfdump.txt" --original "$fixture"
          gdb-multiarch -q -nx -batch \
            -ex 'set debuginfod enabled off' \
            -ex "file $fixture" -ex "symbol-file $output" -ex 'info functions'

      - name: Rebased Ghidra project normalization
        if: matrix.target == 'x86_64'
        run: |
          src/test/integration/rebased-program-export.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2"

      - name: Default and stale executable path policy
        if: matrix.target == 'x86_64'
        run: |
          src/test/integration/output-path-policy.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2"

      - name: Actual filesystem traversal through saved-program export and source lookup
        if: matrix.target == 'x86_64'
        run: python3 src/test/integration/path-traversal-export.py "$GHIDRA_INSTALL_DIR"

      - name: Automatic build-ID and debuglink sidecar association
        env:
          TARGET: ${{ matrix.target }}
        run: |
          FORGE_MODULE="$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge" \
            FORGE_REPORT_MANIFEST="$PWD/build/test-results/report-handoff/$TARGET.json" \
            src/test/integration/build-id-discovery.sh "$TARGET"

      - name: Retain bounded primary fixture diagnostics
        if: always()
        env:
          TARGET: ${{ matrix.target }}
        run: python3 src/test/integration/capture-primary-fixtures.py "$TARGET"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: target-preflight-${{ matrix.target }}
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: matrix.target == 'x86_64'
        with:
          name: linux-x86-export-reference
          path: |
            build/fixtures/x86_64/semantic.exec.reference
            build/fixtures/x86_64/semantic.exec.stripped
            build/fixtures/x86_64/semantic.exec.ghidra-forge.dbg
            build/fixtures/x86_64/semantic.exec.ghidra-forge.dbg.c
          if-no-files-found: error

  windows-host:
    needs: [ release-package, native-windows, target-preflight ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Windows validation tools
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-llvm

      - name: Cache Ghidra 12.0.3 archive
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\ghidra-download\${{ env.GHIDRA_ARCHIVE }}
          key: ghidra-windows-${{ env.GHIDRA_ARCHIVE_SHA256 }}

      - name: Install pinned Ghidra
        shell: pwsh
        run: |
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'ghidra-download'
          $installDirectory = Join-Path $env:RUNNER_TEMP 'ghidra'
          New-Item -ItemType Directory -Force $downloadDirectory, $installDirectory | Out-Null
          $archive = Join-Path $downloadDirectory $env:GHIDRA_ARCHIVE
          if (-not (Test-Path $archive)) {
            Invoke-WebRequest -Uri $env:GHIDRA_DOWNLOAD_URL -OutFile $archive
          }
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:GHIDRA_ARCHIVE_SHA256) {
            throw "Ghidra SHA-256 mismatch: $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $installDirectory -Force
          $ghidra = Join-Path $installDirectory 'ghidra_12.0.3_PUBLIC'
          "GHIDRA_INSTALL_DIR=$ghidra" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/download-artifact@v8
        with:
          name: ghidra-dwarf-forge-extension
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: libdwarf-windows-integration
          path: native-windows

      - uses: actions/download-artifact@v8
        with:
          name: linux-x86-export-reference
          path: linux-reference

      - name: Record exact Windows toolchain versions
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $resultDirectory = 'build\test-results\windows-host'
          New-Item -ItemType Directory -Force $resultDirectory | Out-Null
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          $env:PATH = "$mingwBin;$env:PATH"
          $properties = Join-Path $env:GHIDRA_INSTALL_DIR 'Ghidra\application.properties'
          & {
            "ghidra_archive=$env:GHIDRA_ARCHIVE"
            "ghidra_archive_sha256=$env:GHIDRA_ARCHIVE_SHA256"
            Get-Content $properties | Where-Object {
              $_ -match '^application\.(version|release\.name|build\.date)='
            }
            "libdwarf_release=$env:LIBDWARF_VERSION"
            "libdwarf_source_commit=$env:LIBDWARF_SOURCE_COMMIT"
            "libdwarf_archive_sha256=$env:LIBDWARF_ARCHIVE_SHA256"
            Get-Content 'native-windows\BUILD-METADATA.txt'
            Get-FileHash -Algorithm SHA256 native-windows\*.dll | Format-Table -AutoSize
            '[java]'
            & java -version 2>&1
            '[gradle]'
            & .\gradlew.bat --version
            '[readelf]'
            & readelf.exe --version
            '[llvm-dwarfdump]'
            & llvm-dwarfdump.exe --version
          } 2>&1 | Tee-Object -FilePath "$resultDirectory\tool-versions.txt"

      - name: Probe native Windows desktop interaction and actual ACL denial
        shell: pwsh
        run: ./src/test/integration/windows-desktop-acl.ps1

      - name: Install extension and run native-independent Windows checks
        shell: pwsh
        run: |
          $resultDirectory = 'build\test-results\windows-host'
          New-Item -ItemType Directory -Force $resultDirectory | Out-Null
          [scriptblock]::Create((Get-Content -Raw .\support\ghidra-dwarf-forge-headless.ps1)) | Out-Null
          $extension = Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          if ($null -eq $extension) { throw 'extension ZIP is missing' }
          Expand-Archive -Path $extension.FullName `
            -DestinationPath (Join-Path $env:GHIDRA_INSTALL_DIR 'Ghidra\Extensions') -Force
          & .\gradlew.bat addressNormalizerSmoke outputPathPolicySmoke exportReportSmoke `
            syntheticSourceSmoke artifactPairPublisherSmoke ghidraTargetAgreementSmoke `
            opaqueRegisterEffectsSmoke qualifiedFunctionNameSmoke externalFunctionInventorySmoke dwarfAddressRangesSmoke `
            arm32ModeSymbolsSmoke ghidraArm32FunctionModesSmoke dynamicParameterStorageSmoke truncatedSpaceStoreSmoke `
            registerCopySmoke stackFirstUseSmoke pathTraversalSmoke fileDigestsSmoke `
            elfBuildIdSmoke exportReportClaimsSmoke matchedElfPrefixSmoke `
            matchedElfAllocationsSmoke exportArtifactHashBindingSmoke exportReportDetailsSmoke executableProgramBytesSmoke `
            debuglinkCandidateContentSmoke ownedDebuglinkCandidateSmoke 2>&1 |
            Tee-Object -FilePath "$resultDirectory\native-independent.log"
          if ($LASTEXITCODE -ne 0) {
            throw "native-independent Windows checks failed with exit code $LASTEXITCODE"
          }

      - name: Windows file-lock publication rollback
        shell: pwsh
        run: |
          $resultDirectory = (Resolve-Path 'build\test-results\windows-host').Path
          $lockDirectory = Join-Path $resultDirectory 'file-lock'
          New-Item -ItemType Directory -Force $lockDirectory | Out-Null
          $artifact = Join-Path $lockDirectory 'locked.dbg'
          $source = Join-Path $lockDirectory 'locked.dbg.c'
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($artifact, 'preserved artifact', $utf8)
          [System.IO.File]::WriteAllText($source, 'preserved source', $utf8)
          $artifactHash = (Get-FileHash -Algorithm SHA256 $artifact).Hash
          $sourceHash = (Get-FileHash -Algorithm SHA256 $source).Hash
          $sourceLock = [System.IO.File]::Open($source,
            [System.IO.FileMode]::Open, [System.IO.FileAccess]::ReadWrite,
            [System.IO.FileShare]::None)
          try {
            & .\gradlew.bat artifactPairPublisherSmoke `
              "-PlockedArtifact=$artifact" "-PlockedSource=$source" 2>&1 |
              Tee-Object -FilePath (Join-Path $lockDirectory 'gradle.log')
            $lockStatus = $LASTEXITCODE
          }
          finally {
            $sourceLock.Dispose()
          }
          if ($lockStatus -ne 0) {
            throw "Windows file-lock regression failed with exit code $lockStatus"
          }
          if ((Get-FileHash -Algorithm SHA256 $artifact).Hash -ne $artifactHash -or
              (Get-FileHash -Algorithm SHA256 $source).Hash -ne $sourceHash) {
            throw 'file-lock failure did not preserve the previous artifact pair'
          }
          $leftovers = Get-ChildItem $lockDirectory -Force | Where-Object {
            $_.Name -match '\.(?:staged|backup)$'
          }
          if ($leftovers.Count -ne 0) {
            throw "file-lock failure left temporary files: $($leftovers.Name -join ', ')"
          }
          'windows-file-lock-publication=PASS' |
            Set-Content -Path (Join-Path $lockDirectory 'result.txt') -Encoding utf8

      - name: Isolated Windows producer ABI smoke test
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $resultDirectory = 'build\test-results\windows-host\native-producer'
          New-Item -ItemType Directory -Force $resultDirectory | Out-Null
          $consumer = Get-ChildItem native-windows -Filter 'libdwarf-*.dll' |
            Where-Object Name -NotLike 'libdwarfp-*' | Select-Object -First 1
          $producer = Get-ChildItem native-windows -Filter 'libdwarfp-*.dll' |
            Select-Object -First 1
          if ($null -eq $consumer -or $null -eq $producer) {
            throw 'libdwarf Windows DLL pair is missing'
          }
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          $env:PATH = "$(Resolve-Path native-windows);$mingwBin;$env:PATH"
          & .\gradlew.bat nativeProducerSmoke `
            "-PlibdwarfPath=$($consumer.FullName)" `
            "-PlibdwarfpPath=$($producer.FullName)" `
            -PtargetProfile=x86_64 -PnativeIterations=64 2>&1 |
            Tee-Object -FilePath "$resultDirectory\native-producer.log"
          $nativeStatus = $LASTEXITCODE
          "exit_status=$nativeStatus" |
            Set-Content -Path "$resultDirectory\native-producer-status.txt" -Encoding utf8
          if ($nativeStatus -ne 0) {
            Write-Host "::error title=Isolated native producer failure::The isolated native producer process failed or crashed (exit status $nativeStatus). See native-producer.log."
            throw "isolated native producer failed or crashed with exit code $nativeStatus"
          }
          'isolated-native-producer=PASS' |
            Add-Content -Path "$resultDirectory\native-producer-status.txt" -Encoding utf8

          $module = Join-Path $env:GHIDRA_INSTALL_DIR `
            'Ghidra\Extensions\GhidraDwarfForge'
          & .\gradlew.bat packagedNativeProducerSmoke `
            "-PpackagedModuleRoot=$module" `
            -PpackagedPlatform=win_x86_64 `
            -PtargetProfile=x86_64 -PnativeIterations=2 2>&1 |
            Tee-Object -FilePath "$resultDirectory\packaged-native-producer.log"
          if ($LASTEXITCODE -ne 0) {
            throw "packaged native producer smoke failed with exit code $LASTEXITCODE"
          }

      - name: Windows-hosted headless ELF export
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $consumer = Get-ChildItem native-windows -Filter 'libdwarf-*.dll' |
            Where-Object Name -NotLike 'libdwarfp-*' | Select-Object -First 1
          $producer = Get-ChildItem native-windows -Filter 'libdwarfp-*.dll' |
            Select-Object -First 1
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          $env:PATH = "$mingwBin;$env:PATH"
          foreach ($tool in @('readelf.exe', 'llvm-dwarfdump.exe')) {
            if ($null -eq (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Windows validator is missing from ${mingwBin}: $tool"
            }
          }
          .\src\test\integration\windows-headless-export.ps1 `
            -GhidraDirectory $env:GHIDRA_INSTALL_DIR `
            -ConsumerDll $consumer.FullName `
            -ProducerDll $producer.FullName `
            -LinuxReferenceDirectory (Resolve-Path linux-reference)

      - name: Native Windows Script Manager export, console, and chooser cancellation
        shell: pwsh
        timeout-minutes: 15
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          $env:PATH = "$mingwBin;$env:PATH"
          .\src\test\integration\windows-gui-script-manager.ps1 `
            -GhidraDirectory $env:GHIDRA_INSTALL_DIR `
            -ModuleDirectory (Join-Path $env:GHIDRA_INSTALL_DIR 'Ghidra\Extensions\GhidraDwarfForge') `
            -Fixture (Resolve-Path 'linux-reference\semantic.exec.stripped').Path `
            -Reference (Resolve-Path 'linux-reference\semantic.exec.reference').Path

      - name: Clean Windows installed-release export without external natives
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $resultDirectory = 'build\test-results\windows-host\packaged-release'
          New-Item -ItemType Directory -Force $resultDirectory | Out-Null
          $fixture = (Resolve-Path 'linux-reference\semantic.exec.stripped').Path
          $output = Join-Path (Resolve-Path $resultDirectory).Path 'semantic.exec.packaged.dbg'
          $log = Join-Path (Resolve-Path $resultDirectory).Path 'headless.log'
          $wrapper = Join-Path $env:GHIDRA_INSTALL_DIR `
            'Ghidra\Extensions\GhidraDwarfForge\support\ghidra-dwarf-forge-headless.ps1'
          $before = (Get-FileHash -Algorithm SHA256 $fixture).Hash
          & $wrapper -GhidraDirectory $env:GHIDRA_INSTALL_DIR `
            -Import $fixture -Output $output -Log $log
          if ($LASTEXITCODE -ne 0) {
            throw "packaged Windows export failed with exit code $LASTEXITCODE"
          }
          $after = (Get-FileHash -Algorithm SHA256 $fixture).Hash
          if ($before -ne $after) { throw 'packaged export modified the input ELF' }
          if ((Get-Content -Raw $log) -notmatch
              [regex]::Escape('native policy: verified packaged libraries')) {
            throw 'packaged-native policy was not reported'
          }
          foreach ($artifact in @($output, "$output.c")) {
            if (-not (Test-Path $artifact -PathType Leaf)) {
              throw "packaged export output is missing: $artifact"
            }
          }
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          $env:PATH = "$mingwBin;$env:PATH"
          & readelf.exe -h $output
          if ($LASTEXITCODE -ne 0) { throw 'readelf header validation failed' }
          & readelf.exe --debug-dump=info $output
          if ($LASTEXITCODE -ne 0) { throw 'readelf DWARF validation failed' }
          $stringDump = & readelf.exe --string-dump=.debug_str $output
          if ($LASTEXITCODE -ne 0 -or ($stringDump -join "`n") -notmatch
              'GhidraDwarfForge') {
            throw 'readelf string-table validation failed'
          }
          & llvm-dwarfdump.exe --verify $output
          if ($LASTEXITCODE -ne 0) { throw 'LLVM DWARF verification failed' }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-host-validation
          path: |
            build/test-results/windows-host/
            build/test-results/windows-desktop-acl/
          if-no-files-found: warn
          retention-days: 14

  required-validation:
    if: always()
    needs:
      - workflow-lint
      - native-linux
      - native-windows
      - extension-build
      - release-package
      - target-preflight
      - windows-host
    runs-on: ubuntu-24.04
    steps:
      - name: Require every supported validation path
        env:
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          NATIVE_LINUX_RESULT: ${{ needs.native-linux.result }}
          NATIVE_WINDOWS_RESULT: ${{ needs.native-windows.result }}
          EXTENSION_BUILD_RESULT: ${{ needs.extension-build.result }}
          RELEASE_PACKAGE_RESULT: ${{ needs.release-package.result }}
          TARGET_PREFLIGHT_RESULT: ${{ needs.target-preflight.result }}
          WINDOWS_HOST_RESULT: ${{ needs.windows-host.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in "$WORKFLOW_LINT_RESULT" "$NATIVE_LINUX_RESULT" \
              "$NATIVE_WINDOWS_RESULT" "$EXTENSION_BUILD_RESULT" \
              "$RELEASE_PACKAGE_RESULT" "$TARGET_PREFLIGHT_RESULT" \
              "$WINDOWS_HOST_RESULT"; do
            if [[ "$result" != success ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "supported validation path failed or was skipped" >&2
            exit 1
          fi
          echo "required-validation=PASS"
