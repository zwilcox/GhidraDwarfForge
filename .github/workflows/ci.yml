      - name: True function entry below-entry body ranges and rebases
        if: matrix.target == 'x86_64'
        run: |
          src/test/integration/function-entry-export.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2"

      - name: Analyst aliases retain discontiguous and below-entry function bodies
        if: matrix.target == 'x86_64'
        env:
          FORGE_ENTRY_ALIASES: 1
        run: |
          src/test/integration/function-entry-export.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2"

      - name: Existing compiler DWARF replacement
        if: matrix.target == 'x86_64'
        run: |
          src/test/integration/existing-debug-export.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2"

      - name: Real-world distro binary export and debugging
        if: matrix.target == 'x86_64'
        run: src/test/integration/real-world-export.sh "$GHIDRA_INSTALL_DIR"

      - name: Published source and sidecar timestamp regression
        if: matrix.target == 'x86_64'
        run: src/test/integration/artifact-pair-timestamps.sh

      - name: GUI output chooser selection and cancellation
        if: matrix.target == 'x86_64'
        run: |
          src/test/integration/gui-output-fallback.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge" \
            "$PWD/build/fixtures/x86_64/semantic.exec.stripped" \
            "$PWD/build/fixtures/x86_64/semantic.exec.reference"

      - name: Installed Script Manager discovery, export, console, and cancellation
        if: matrix.target == 'x86_64'
        run: |
          src/test/integration/gui-script-manager.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge" \
            "$PWD/build/fixtures/x86_64/semantic.exec.stripped" \
            "$PWD/build/fixtures/x86_64/semantic.exec.reference"

      - name: Clean installed-release export without external natives
        if: matrix.target == 'x86_64'
        run: |
          set -euo pipefail
          fixture="$PWD/build/fixtures/x86_64/semantic.exec.stripped"
          result_directory="$PWD/build/test-results/packaged-release"
          output="$result_directory/semantic.exec.packaged.dbg"
          log="$result_directory/headless.log"
          wrapper="$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge/support/ghidra-dwarf-forge-headless"
          mkdir -p "$result_directory"
          before=$(sha256sum "$fixture" | cut -d' ' -f1)
          "$wrapper" --ghidra-dir="$GHIDRA_INSTALL_DIR" --import="$fixture" \
            --output="$output" --log="$log"
          after=$(sha256sum "$fixture" | cut -d' ' -f1)
          test "$before" = "$after"
          grep -Fq 'native policy: verified packaged libraries' "$log"
          test -s "$output"
          test -s "$output.c"
          readelf -h "$output"
          readelf -S "$output"
          readelf --debug-dump=info "$output"
          readelf --debug-dump=abbrev "$output"
          readelf --string-dump=.debug_str "$output" | grep -q GhidraDwarfForge
          readelf --debug-dump=decodedline "$output"
          llvm-dwarfdump --verify "$output"
          python3 src/test/integration/check-dwarfdump.py "$output" \
            "$PWD/build/test-results/clean-install/dwarfdump.txt" --original "$fixture"
          gdb-multiarch -q -nx -batch \
            -ex 'set debuginfod enabled off' \
            -ex "file $fixture" -ex "symbol-file $output" -ex 'info functions'

      - name: Rebased Ghidra project normalization
        if: matrix.target == 'x86_64'
        run: |
          src/test/integration/rebased-program-export.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2"

      - name: Default and stale executable path policy
        if: matrix.target == 'x86_64'
        run: |
          src/test/integration/output-path-policy.sh \
            "$GHIDRA_INSTALL_DIR" \
            "$PWD/native-integration/libdwarf.so.2.3.2" \
            "$PWD/native-integration/libdwarfp.so.2.3.2"

      - name: Actual filesystem traversal through saved-program export and source lookup
        if: matrix.target == 'x86_64'
        run: python3 src/test/integration/path-traversal-export.py "$GHIDRA_INSTALL_DIR"

      - name: Automatic build-ID and debuglink sidecar association
        env:
          TARGET: ${{ matrix.target }}
        run: |
          FORGE_MODULE="$GHIDRA_INSTALL_DIR/Ghidra/Extensions/GhidraDwarfForge" \
            FORGE_REPORT_MANIFEST="$PWD/build/test-results/report-handoff/$TARGET.json" \
            src/test/integration/build-id-discovery.sh "$TARGET"

      - name: Retain bounded primary fixture diagnostics
        if: always()
        env:
          TARGET: ${{ matrix.target }}
        run: python3 src/test/integration/capture-primary-fixtures.py "$TARGET"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: target-preflight-${{ matrix.target }}
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: matrix.target == 'x86_64'
        with:
          name: linux-x86-export-reference
          path: |
            build/fixtures/x86_64/semantic.exec.reference
            build/fixtures/x86_64/semantic.exec.stripped
            build/fixtures/x86_64/semantic.exec.ghidra-forge.dbg
            build/fixtures/x86_64/semantic.exec.ghidra-forge.dbg.c
          if-no-files-found: error

  windows-host:
    needs: [ release-package, native-windows, target-preflight ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Windows validation tools
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-llvm

      - name: Cache Ghidra 12.0.3 archive
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\ghidra-download\${{ env.GHIDRA_ARCHIVE }}
          key: ghidra-windows-${{ env.GHIDRA_ARCHIVE_SHA256 }}

      - name: Install pinned Ghidra
        shell: pwsh
        run: |
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'ghidra-download'
          $installDirectory = Join-Path $env:RUNNER_TEMP 'ghidra'
          New-Item -ItemType Directory -Force $downloadDirectory, $installDirectory | Out-Null
          $archive = Join-Path $downloadDirectory $env:GHIDRA_ARCHIVE
          if (-not (Test-Path $archive)) {
            Invoke-WebRequest -Uri $env:GHIDRA_DOWNLOAD_URL -OutFile $archive
          }
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:GHIDRA_ARCHIVE_SHA256) {
            throw "Ghidra SHA-256 mismatch: $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $installDirectory -Force
          $ghidra = Join-Path $installDirectory 'ghidra_12.0.3_PUBLIC'
          "GHIDRA_INSTALL_DIR=$ghidra" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/download-artifact@v8
        with:
          name: ghidra-dwarf-forge-extension
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: libdwarf-windows-integration
          path: native-windows

      - uses: actions/download-artifact@v8
        with:
          name: linux-x86-export-reference
          path: linux-reference

      - name: Record exact Windows toolchain versions
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $resultDirectory = 'build\test-results\windows-host'
          New-Item -ItemType Directory -Force $resultDirectory | Out-Null
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          $env:PATH = "$mingwBin;$env:PATH"
          $properties = Join-Path $env:GHIDRA_INSTALL_DIR 'Ghidra\application.properties'
          & {
            "ghidra_archive=$env:GHIDRA_ARCHIVE"
            "ghidra_archive_sha256=$env:GHIDRA_ARCHIVE_SHA256"
            Get-Content $properties | Where-Object {
              $_ -match '^application\.(version|release\.name|build\.date)='
            }
            "libdwarf_release=$env:LIBDWARF_VERSION"
            "libdwarf_source_commit=$env:LIBDWARF_SOURCE_COMMIT"
            "libdwarf_archive_sha256=$env:LIBDWARF_ARCHIVE_SHA256"
            Get-Content 'native-windows\BUILD-METADATA.txt'
            Get-FileHash -Algorithm SHA256 native-windows\*.dll | Format-Table -AutoSize
            '[java]'
            & java -version 2>&1
            '[gradle]'
            & .\gradlew.bat --version
            '[readelf]'
            & readelf.exe --version
            '[llvm-dwarfdump]'
            & llvm-dwarfdump.exe --version
          } 2>&1 | Tee-Object -FilePath "$resultDirectory\tool-versions.txt"

      - name: Probe native Windows desktop interaction and actual ACL denial
        shell: pwsh
        run: ./src/test/integration/windows-desktop-acl.ps1

      - name: Install extension and run native-independent Windows checks
        shell: pwsh
        run: |
          $resultDirectory = 'build\test-results\windows-host'
          New-Item -ItemType Directory -Force $resultDirectory | Out-Null
          [scriptblock]::Create((Get-Content -Raw .\support\ghidra-dwarf-forge-headless.ps1)) | Out-Null
          $extension = Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          if ($null -eq $extension) { throw 'extension ZIP is missing' }
          Expand-Archive -Path $extension.FullName `
            -DestinationPath (Join-Path $env:GHIDRA_INSTALL_DIR 'Ghidra\Extensions') -Force
          & .\gradlew.bat dwarfTargetSmoke variableStorageSmoke addressNormalizerSmoke outputPathPolicySmoke exportReportSmoke `
            syntheticSourceSmoke artifactPairPublisherSmoke ghidraTargetAgreementSmoke `
            opaqueRegisterEffectsSmoke registerBodyCoverageSmoke outsideBodyFlowSmoke mixedParameterPrefixSmoke mipsAbiFlagsSmoke mipsFp32PairSmoke qualifiedFunctionNameSmoke externalFunctionInventorySmoke dwarfAddressRangesSmoke `
            functionAliasSymbolsSmoke dynamicSymbolMirrorSmoke sectionlessDynamicSymbolsSmoke sectionlessUnwindSmoke mipsFunctionAliasSymbolsSmoke arm32FunctionAliasSymbolsSmoke ghidraFunctionAliasesSmoke localSymbolMergeSmoke arm32ModeSymbolsSmoke ghidraArm32FunctionModesSmoke dynamicParameterStorageSmoke indirectParameterStorageSmoke curatedThunkSmoke functionRelationsSmoke functionRelationExtractionSmoke callingConventionPolicySmoke functionPointerCallPolicySmoke customCallStorageSmoke compilerCallPolicySmoke mipsFloatingCallPolicySmoke mipsAggregateCallPolicySmoke formalFunctionReturnSmoke recoveredReturnSmoke recoveredParameterSmoke dynamicCompositeOrderSmoke truncatedSpaceStoreSmoke `
            registerCopySmoke secondRegisterCopySmoke registerCopyChainSmoke laterRegisterLocalSmoke definedRegisterLocalSmoke localDefinitionFlowSmoke localCallLifetimeSmoke callMemoryEffectsSmoke localMappingsSmoke mutableStackMappingsSmoke compositeValueFlowSmoke lexicalScopeEvidenceSmoke lexicalScopeModelSmoke objectParameterSmoke classScopeSmoke classScopeNamesSmoke globalScopeNamesSmoke classScopeModelSmoke classBindingEvidenceSmoke staticBindingEvidenceSmoke staticScopeExtractionSmoke staticRecoverySmoke classScopeExtractionSmoke mergedLocalLifetimeSmoke stackValueFlowSmoke stackLocalIdentitySmoke stackLocalLifetimeSmoke stackControlFlowSmoke stackSpillSmoke directLeafCallSmoke inspectedCallsSmoke compositeRegisterPrefixSmoke stackFirstUseSmoke pathTraversalSmoke fileDigestsSmoke `
            elfBuildIdSmoke exportReportClaimsSmoke matchedElfPrefixSmoke `
            matchedElfAllocationsSmoke exportArtifactHashBindingSmoke exportReportDetailsSmoke executableProgramBytesSmoke `
            debuglinkCandidateContentSmoke ownedDebuglinkCandidateSmoke 2>&1 |
            Tee-Object -FilePath "$resultDirectory\native-independent.log"
          if ($LASTEXITCODE -ne 0) {
            throw "native-independent Windows checks failed with exit code $LASTEXITCODE"
          }

      - name: Windows file-lock publication rollback
        shell: pwsh
        run: |
          $resultDirectory = (Resolve-Path 'build\test-results\windows-host').Path
          $lockDirectory = Join-Path $resultDirectory 'file-lock'
          New-Item -ItemType Directory -Force $lockDirectory | Out-Null
          $artifact = Join-Path $lockDirectory 'locked.dbg'
          $source = Join-Path $lockDirectory 'locked.dbg.c'
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($artifact, 'preserved artifact', $utf8)
          [System.IO.File]::WriteAllText($source, 'preserved source', $utf8)
          $artifactHash = (Get-FileHash -Algorithm SHA256 $artifact).Hash
          $sourceHash = (Get-FileHash -Algorithm SHA256 $source).Hash
          $sourceLock = [System.IO.File]::Open($source,
            [System.IO.FileMode]::Open, [System.IO.FileAccess]::ReadWrite,
            [System.IO.FileShare]::None)
          try {
            & .\gradlew.bat artifactPairPublisherSmoke `
              "-PlockedArtifact=$artifact" "-PlockedSource=$source" 2>&1 |
              Tee-Object -FilePath (Join-Path $lockDirectory 'gradle.log')
            $lockStatus = $LASTEXITCODE
          }
          finally {
            $sourceLock.Dispose()
          }
          if ($lockStatus -ne 0) {
            throw "Windows file-lock regression failed with exit code $lockStatus"
          }
          if ((Get-FileHash -Algorithm SHA256 $artifact).Hash -ne $artifactHash -or
              (Get-FileHash -Algorithm SHA256 $source).Hash -ne $sourceHash) {
            throw 'file-lock failure did not preserve the previous artifact pair'
          }
          $leftovers = Get-ChildItem $lockDirectory -Force | Where-Object {
            $_.Name -match '\.(?:staged|backup)$'
          }
          if ($leftovers.Count -ne 0) {
            throw "file-lock failure left temporary files: $($leftovers.Name -join ', ')"
          }
          'windows-file-lock-publication=PASS' |
            Set-Content -Path (Join-Path $lockDirectory 'result.txt') -Encoding utf8

      - name: Isolated Windows producer ABI smoke test
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $resultDirectory = 'build\test-results\windows-host\native-producer'
          New-Item -ItemType Directory -Force $resultDirectory | Out-Null
          $consumer = Get-ChildItem native-windows -Filter 'libdwarf-*.dll' |
            Where-Object Name -NotLike 'libdwarfp-*' | Select-Object -First 1
          $producer = Get-ChildItem native-windows -Filter 'libdwarfp-*.dll' |
            Select-Object -First 1
          if ($null -eq $consumer -or $null -eq $producer) {
            throw 'libdwarf Windows DLL pair is missing'
          }
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          $env:PATH = "$(Resolve-Path native-windows);$mingwBin;$env:PATH"
          & .\gradlew.bat nativeProducerSmoke `
            "-PlibdwarfPath=$($consumer.FullName)" `
            "-PlibdwarfpPath=$($producer.FullName)" `
            -PtargetProfile=x86_64 -PnativeIterations=64 2>&1 |
            Tee-Object -FilePath "$resultDirectory\native-producer.log"
          $nativeStatus = $LASTEXITCODE
          "exit_status=$nativeStatus" |
            Set-Content -Path "$resultDirectory\native-producer-status.txt" -Encoding utf8
          if ($nativeStatus -ne 0) {
            Write-Host "::error title=Isolated native producer failure::The isolated native producer process failed or crashed (exit status $nativeStatus). See native-producer.log."
            throw "isolated native producer failed or crashed with exit code $nativeStatus"
          }
          'isolated-native-producer=PASS' |
            Add-Content -Path "$resultDirectory\native-producer-status.txt" -Encoding utf8

          $module = Join-Path $env:GHIDRA_INSTALL_DIR `
            'Ghidra\Extensions\GhidraDwarfForge'
          & .\gradlew.bat packagedNativeProducerSmoke `
            "-PpackagedModuleRoot=$module" `
            -PpackagedPlatform=win_x86_64 `
            -PtargetProfile=x86_64 -PnativeIterations=2 2>&1 |
            Tee-Object -FilePath "$resultDirectory\packaged-native-producer.log"
          if ($LASTEXITCODE -ne 0) {
            throw "packaged native producer smoke failed with exit code $LASTEXITCODE"
          }

          & .\gradlew.bat packagedNativeProducerSmoke `
            "-PpackagedModuleRoot=$module" `
            -PpackagedPlatform=win_x86_64 `
            -PtargetProfile=i386 -PnativeIterations=16 2>&1 |
            Tee-Object -FilePath "$resultDirectory\packaged-i386-producer.log"
          if ($LASTEXITCODE -ne 0) {
            throw "packaged i386 producer smoke failed with exit code $LASTEXITCODE"
          }

      - name: Windows-hosted headless ELF export
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $consumer = Get-ChildItem native-windows -Filter 'libdwarf-*.dll' |
            Where-Object Name -NotLike 'libdwarfp-*' | Select-Object -First 1
          $producer = Get-ChildItem native-windows -Filter 'libdwarfp-*.dll' |
            Select-Object -First 1
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          $env:PATH = "$mingwBin;$env:PATH"
          foreach ($tool in @('readelf.exe', 'llvm-dwarfdump.exe')) {
            if ($null -eq (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Windows validator is missing from ${mingwBin}: $tool"
            }
          }
          .\src\test\integration\windows-headless-export.ps1 `
            -GhidraDirectory $env:GHIDRA_INSTALL_DIR `
            -ConsumerDll $consumer.FullName `
            -ProducerDll $producer.FullName `
            -LinuxReferenceDirectory (Resolve-Path linux-reference)

      - name: Native Windows Script Manager export, console, and chooser cancellation
        shell: pwsh
        timeout-minutes: 15
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          $env:PATH = "$mingwBin;$env:PATH"
          .\src\test\integration\windows-gui-script-manager.ps1 `
            -GhidraDirectory $env:GHIDRA_INSTALL_DIR `
            -ModuleDirectory (Join-Path $env:GHIDRA_INSTALL_DIR 'Ghidra\Extensions\GhidraDwarfForge') `
            -Fixture (Resolve-Path 'linux-reference\semantic.exec.stripped').Path `
            -Reference (Resolve-Path 'linux-reference\semantic.exec.reference').Path

      - name: Clean Windows installed-release export without external natives
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $resultDirectory = 'build\test-results\windows-host\packaged-release'
          New-Item -ItemType Directory -Force $resultDirectory | Out-Null
          $fixture = (Resolve-Path 'linux-reference\semantic.exec.stripped').Path
          $output = Join-Path (Resolve-Path $resultDirectory).Path 'semantic.exec.packaged.dbg'
          $log = Join-Path (Resolve-Path $resultDirectory).Path 'headless.log'
          $wrapper = Join-Path $env:GHIDRA_INSTALL_DIR `
            'Ghidra\Extensions\GhidraDwarfForge\support\ghidra-dwarf-forge-headless.ps1'
          $before = (Get-FileHash -Algorithm SHA256 $fixture).Hash
          & $wrapper -GhidraDirectory $env:GHIDRA_INSTALL_DIR `
            -Import $fixture -Output $output -Log $log
          if ($LASTEXITCODE -ne 0) {
            throw "packaged Windows export failed with exit code $LASTEXITCODE"
          }
          $after = (Get-FileHash -Algorithm SHA256 $fixture).Hash
          if ($before -ne $after) { throw 'packaged export modified the input ELF' }
          if ((Get-Content -Raw $log) -notmatch
              [regex]::Escape('native policy: verified packaged libraries')) {
            throw 'packaged-native policy was not reported'
          }
          foreach ($artifact in @($output, "$output.c")) {
            if (-not (Test-Path $artifact -PathType Leaf)) {
              throw "packaged export output is missing: $artifact"
            }
          }
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          $env:PATH = "$mingwBin;$env:PATH"
          & readelf.exe -h $output
          if ($LASTEXITCODE -ne 0) { throw 'readelf header validation failed' }
          & readelf.exe --debug-dump=info $output
          if ($LASTEXITCODE -ne 0) { throw 'readelf DWARF validation failed' }
          $stringDump = & readelf.exe --string-dump=.debug_str $output
          if ($LASTEXITCODE -ne 0 -or ($stringDump -join "`n") -notmatch
              'GhidraDwarfForge') {
            throw 'readelf string-table validation failed'
          }
          & llvm-dwarfdump.exe --verify $output
          if ($LASTEXITCODE -ne 0) { throw 'LLVM DWARF verification failed' }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-host-validation
          path: |
            build/test-results/windows-host/
            build/test-results/windows-desktop-acl/
          if-no-files-found: warn
          retention-days: 14

  required-validation:
    if: always()
    needs:
      - workflow-lint
      - native-linux
      - native-windows
      - extension-build
      - release-package
      - target-preflight
      - windows-host
    runs-on: ubuntu-24.04
    steps:
      - name: Require every supported validation path
        env:
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          NATIVE_LINUX_RESULT: ${{ needs.native-linux.result }}
          NATIVE_WINDOWS_RESULT: ${{ needs.native-windows.result }}
          EXTENSION_BUILD_RESULT: ${{ needs.extension-build.result }}
          RELEASE_PACKAGE_RESULT: ${{ needs.release-package.result }}
          TARGET_PREFLIGHT_RESULT: ${{ needs.target-preflight.result }}
          WINDOWS_HOST_RESULT: ${{ needs.windows-host.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in "$WORKFLOW_LINT_RESULT" "$NATIVE_LINUX_RESULT" \
              "$NATIVE_WINDOWS_RESULT" "$EXTENSION_BUILD_RESULT" \
              "$RELEASE_PACKAGE_RESULT" "$TARGET_PREFLIGHT_RESULT" \
              "$WINDOWS_HOST_RESULT"; do
            if [[ "$result" != success ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "supported validation path failed or was skipped" >&2
            exit 1
          fi
          echo "required-validation=PASS"
