name: Performance measurement controls

on:
    workflow_dispatch:
        inputs:
            historical:
                description: Replay the original Ghidra 12.0.3 coverage measurement
                type: boolean
                default: false
            baseline:
                description: Optional full Ghidra 12.2 baseline commit with retained production CI packages
                type: string
    pull_request:
        paths:
            - '.github/workflows/performance.yml'
            - 'src/test/performance/**'

permissions:
    contents: read
    actions: read

env:
    PERFORMANCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    PERFORMANCE_CANDIDATE: ${{ inputs.historical && 'f4609efbca5e0c45fe199b162d0051e8bb5017d1' || github.event.pull_request.head.sha || github.sha }}
    GHIDRA_VERSION: ${{ inputs.historical && '12.0.3' || '12.2' }}
    GHIDRA_ARCHIVE: ${{ inputs.historical && 'ghidra_12.0.3_PUBLIC_20260210.zip' || 'ghidra_12.2_PUBLIC_20261016.zip' }}
    GHIDRA_ARCHIVE_SHA256: ${{ inputs.historical && '90d3fffb20b00030dcef8d2a24dd0f422d3a61e432b3ad43f77233ac6d667981' || '2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67' }}

jobs:
    windows-measurement:
        runs-on: windows-2025
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  ref: ${{ env.PERFORMANCE_HEAD }}
            - uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  install: mingw-w64-x86_64-gcc
            - name: Compile isolated measurement helper and independent child fixture
              shell: msys2 {0}
              run: |
                  set -euo pipefail
                  mkdir -p build/test-results/windows-measurement
                  gcc --version > build/test-results/windows-measurement/compiler.txt
                  gcc -std=c11 -O2 -Wall -Wextra -Werror -municode \
                      src/test/performance/windows-measure.c \
                      -o build/test-results/windows-measurement/windows-measure.exe
                  gcc -std=c11 -O2 -Wall -Wextra -Werror -municode \
                      src/test/performance/windows-measure-payload.c \
                      -o build/test-results/windows-measurement/payload.exe
                  sha256sum src/test/performance/windows-measure*.c \
                      build/test-results/windows-measurement/*.exe \
                      > build/test-results/windows-measurement/SHA256SUMS
            - name: Prove native Windows process-tree accounting and failure controls
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  python --version
                  python src/test/python/test_headless_observations.py
                  if ($LASTEXITCODE -ne 0) { throw 'headless observation controls failed' }
                  python src/test/python/test_jfr_phases.py
                  if ($LASTEXITCODE -ne 0) { throw 'JFR phase controls failed' }
                  python src/test/performance/test-catalog-source-equivalence.py
                  if ($LASTEXITCODE -ne 0) { throw 'source catalog comparison controls failed' }
                  python src/test/performance/test-dwarf-revision-equivalence.py
                  if ($LASTEXITCODE -ne 0) { throw 'DWARF revision comparison controls failed' }
                  python src/test/performance/test-coverage-measurement-package.py
                  if ($LASTEXITCODE -ne 0) { throw 'measurement package audit controls failed' }
                  python src/test/performance/test-windows-measurement.py `
                      build/test-results/windows-measurement/windows-measure.exe `
                      build/test-results/windows-measurement/payload.exe `
                      build/test-results/windows-measurement
                  if ($LASTEXITCODE -ne 0) { throw 'native accounting controls failed' }
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: windows-performance-measurement-controls
                  path: build/test-results/windows-measurement/
                  if-no-files-found: error
                  retention-days: 14

    corpus:
        runs-on: ubuntu-24.04
        timeout-minutes: 50
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  ref: ${{ env.PERFORMANCE_HEAD }}
            - name: Install source-build tools
              run: |
                  sudo apt-get update -y
                  sudo apt-get install --no-install-recommends -y build-essential bison flex m4 \
                      swig bc python3-dev python3-setuptools libssl-dev efitools curl
            - name: Build shared pinned ELF corpus and retain corresponding source
              run: python3 src/test/performance/prepare-host-corpus.py build/performance-corpus
            - uses: actions/upload-artifact@v7
              with:
                  name: performance-corpus
                  path: build/performance-corpus/
                  if-no-files-found: error
                  retention-days: 14
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: performance-corpus-failure
                  path: |
                      build/performance-corpus/build-evidence/
                      build/performance-corpus-uboot-build/run.*/*.log
                      build/performance-corpus-uboot-build/run.*/*.stderr
                      build/performance-corpus-uboot-build/run.*/*.json
                  retention-days: 14

    packages:
        runs-on: ubuntu-24.04
        timeout-minutes: 130
        outputs:
            baseline: ${{ steps.packages.outputs.baseline }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  ref: ${{ env.PERFORMANCE_HEAD }}
            - name: Fetch exact-head CI artifacts without rebuilding production natives
              id: packages
              env:
                  GH_TOKEN: ${{ github.token }}
                  REQUESTED_BASELINE: ${{ inputs.historical && '1bb4c14c550d277817315cf0ed97853a949e1e03' || inputs.baseline }}
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
              run: |
                  set -euo pipefail
                  baseline="$REQUESTED_BASELINE"
                  if [[ -z "$baseline" ]]; then
                      baseline=${PR_BASE:-$(gh api "repos/$GITHUB_REPOSITORY/commits/$PERFORMANCE_HEAD" --jq '.parents[0].sha')}
                      gh api -H 'Accept: application/vnd.github.raw+json' \
                          "repos/$GITHUB_REPOSITORY/contents/.github/workflows/ci.yml?ref=$baseline" > "$RUNNER_TEMP/base-ci.yml"
                      if ! grep -Fxq "  GHIDRA_ARCHIVE: $GHIDRA_ARCHIVE" "$RUNNER_TEMP/base-ci.yml"; then
                          # The migration PR's base still builds for the previous SDK.
                          baseline=bc702d094f7f691e20425e5c17eb50d78a6201cc
                      fi
                  fi
                  python3 src/test/performance/fetch-ci-packages.py \
                      "$PERFORMANCE_CANDIDATE" "$baseline" build/performance-packages
                  echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: performance-packages
                  path: build/performance-packages/
                  if-no-files-found: error
                  retention-days: 14

    windows-workloads:
        needs: [windows-measurement, corpus, packages]
        runs-on: windows-2025
        timeout-minutes: 120
        env:
            PERFORMANCE_BASELINE: ${{ needs.packages.outputs.baseline }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  ref: ${{ env.PERFORMANCE_HEAD }}
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: ${{ inputs.historical && '21' || '25' }}
            - uses: msys2/setup-msys2@v2
              id: msys2
              with:
                  msystem: MINGW64
                  update: true
                  install: mingw-w64-x86_64-binutils mingw-w64-x86_64-llvm
            - uses: actions/download-artifact@v8
              with:
                  name: windows-performance-measurement-controls
                  path: measurement
            - uses: actions/download-artifact@v8
              with:
                  name: performance-corpus
                  path: corpus
            - uses: actions/download-artifact@v8
              with:
                  name: performance-packages
                  path: packages
            - uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}\ghidra-download\${{ env.GHIDRA_ARCHIVE }}
                  key: ghidra-windows-${{ env.GHIDRA_ARCHIVE_SHA256 }}
            - name: Install isolated baseline and candidate packages
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $download = Join-Path $env:RUNNER_TEMP 'ghidra-download'
                  New-Item -ItemType Directory -Force $download | Out-Null
                  $archive = Join-Path $download $env:GHIDRA_ARCHIVE
                  if (-not (Test-Path $archive)) {
                      $url = "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_$($env:GHIDRA_VERSION)_build/$($env:GHIDRA_ARCHIVE)"
                      Invoke-WebRequest -Uri $url -OutFile $archive
                  }
                  if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GHIDRA_ARCHIVE_SHA256) {
                      throw 'Ghidra archive hash mismatch'
                  }
                  foreach ($role in @('baseline', 'candidate')) {
                      $destination = Join-Path $env:RUNNER_TEMP "performance-$role"
                      Expand-Archive $archive -DestinationPath $destination
                      $ghidra = Join-Path $destination "ghidra_$($env:GHIDRA_VERSION)_PUBLIC"
                      # launch.bat does not print the selected JVM version by
                      # default. Observe the real Ghidra JVM, not a separate
                      # PATH java process, in both measured installations.
                      $launchProperties = Join-Path $ghidra 'support/launch.properties'
                      $configuration = Get-Content -Raw $launchProperties
                      $javaOverride = 'JAVA_HOME_OVERRIDE=' + $env:JAVA_HOME.Replace('\', '/')
                      $configuration = $configuration -replace '(?m)^JAVA_HOME_OVERRIDE=.*$', $javaOverride
                      $configuration += "`nVMARGS=-showversion`n"
                      [IO.File]::WriteAllText($launchProperties, $configuration, [Text.UTF8Encoding]::new($false))
                      $extensions = @(Get-ChildItem "packages/$role" -Filter '*.zip')
                      if ($extensions.Count -ne 1) { throw "ambiguous $role extension" }
                      if ($role -eq 'baseline' -and $env:GHIDRA_VERSION -eq '12.0.3') {
                          # Preserve the original production module outside Ghidra's
                          # search path; derive a separately receipted control below.
                          $production = Join-Path $env:RUNNER_TEMP 'performance-baseline-production'
                          Expand-Archive $extensions[0].FullName -DestinationPath $production
                          "PERFORMANCE_BASELINE_PRODUCTION=$production" | Out-File $env:GITHUB_ENV -Append
                      }
                      else {
                          Expand-Archive $extensions[0].FullName -DestinationPath (Join-Path $ghidra 'Ghidra/Extensions')
                      }
                      "PERFORMANCE_$($role.ToUpperInvariant())_DIR=$ghidra" | Out-File $env:GITHUB_ENV -Append
                  }
            - name: Derive audited array-corrected baseline measurement control
              if: inputs.historical
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  python src/test/performance/coverage-measurement-package.py `
                      (Join-Path $env:PERFORMANCE_BASELINE_PRODUCTION 'GhidraDwarfForge') `
                      (Join-Path $env:PERFORMANCE_CANDIDATE_DIR 'Ghidra/Extensions/GhidraDwarfForge') `
                      $env:PERFORMANCE_BASELINE_DIR `
                      (Join-Path $env:PERFORMANCE_BASELINE_DIR 'Ghidra/Extensions/GhidraDwarfForge') `
                      build/test-results/windows-workloads/baseline-control
                  if ($LASTEXITCODE -ne 0) { throw 'baseline measurement control failed' }
            - name: Measure actual Windows imports, paired exports, phases and validators
              shell: pwsh
              env:
                  MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
              run: |
                  $ErrorActionPreference = 'Stop'
                  $env:PATH = "$(Join-Path $env:MSYS2_LOCATION 'mingw64/bin');$env:PATH"
                  $env:DWARFDUMP = (Resolve-Path 'packages/checker-windows/libexec/dwarfdump.exe').Path
                  $study = if ($env:GHIDRA_VERSION -eq '12.0.3') {
                      @('--baseline-control-receipt', 'build/test-results/windows-workloads/baseline-control/receipt.json')
                  } else {
                      @('--production-packages', 'packages')
                  }
                  python src/test/performance/windows-workloads.py corpus `
                      $env:PERFORMANCE_BASELINE_DIR $env:PERFORMANCE_CANDIDATE_DIR `
                      measurement/windows-measure.exe build/test-results/windows-workloads --pairs 5 `
                      --checker-configuration packages/checker-windows/share/dwarfdump/dwarfdump.conf `
                      @study
                  if ($LASTEXITCODE -ne 0) { throw 'Windows workload measurement/validation failed' }
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: windows-performance-workloads
                  path: build/test-results/windows-workloads/
                  if-no-files-found: error
                  retention-days: 14

    windows-consumer:
        needs: [windows-workloads]
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  ref: ${{ env.PERFORMANCE_HEAD }}
            - uses: actions/download-artifact@v8
              with:
                  name: performance-corpus
                  path: corpus
            - uses: actions/download-artifact@v8
              with:
                  name: performance-packages
                  path: packages
            - uses: actions/download-artifact@v8
              with:
                  name: windows-performance-workloads
                  path: windows-workloads
            - name: Install independent Linux consumers
              run: |
                  sudo apt-get update -y
                  sudo apt-get install --no-install-recommends -y gdb-multiarch binutils llvm gcc
            - name: Prove compiler source relocation and reject changed corpus inputs
              run: python3 src/test/performance/test-host-consumer-sources.py
            - name: Validate untouched Windows artifacts and exercise Linux GDB
              run: |
                  chmod +x packages/checker-linux/bin/dwarfdump packages/checker-linux/libexec/dwarfdump
                  export DWARFDUMP="$PWD/packages/checker-linux/bin/dwarfdump"
                  python3 src/test/performance/host-consumer.py corpus windows-workloads \
                      build/test-results/windows-performance-consumer
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: windows-performance-consumer
                  path: |
                      build/test-results/windows-performance-consumer/
                      build/test-results/host-consumer-source-controls/
                  if-no-files-found: error
                  retention-days: 14
