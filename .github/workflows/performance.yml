name: Performance measurement controls

on:
    workflow_dispatch:
    pull_request:
        paths:
            - '.github/workflows/performance.yml'
            - 'src/test/performance/**'

permissions:
    contents: read
    actions: read

env:
    PERFORMANCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    PERFORMANCE_BASELINE: 6c776d7415fc5222f7e1314c0c5192454c8aced5
    GHIDRA_ARCHIVE: ghidra_12.0.3_PUBLIC_20260210.zip
    GHIDRA_ARCHIVE_SHA256: 90d3fffb20b00030dcef8d2a24dd0f422d3a61e432b3ad43f77233ac6d667981
    GHIDRA_DOWNLOAD_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.3_build/ghidra_12.0.3_PUBLIC_20260210.zip

jobs:
    windows-measurement:
        runs-on: windows-2025
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  ref: ${{ env.PERFORMANCE_HEAD }}
            - uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  install: mingw-w64-x86_64-gcc
            - name: Compile isolated measurement helper and independent child fixture
              shell: msys2 {0}
              run: |
                  set -euo pipefail
                  mkdir -p build/test-results/windows-measurement
                  gcc --version > build/test-results/windows-measurement/compiler.txt
                  gcc -std=c11 -O2 -Wall -Wextra -Werror -municode \
                      src/test/performance/windows-measure.c \
                      -o build/test-results/windows-measurement/windows-measure.exe
                  gcc -std=c11 -O2 -Wall -Wextra -Werror -municode \
                      src/test/performance/windows-measure-payload.c \
                      -o build/test-results/windows-measurement/payload.exe
                  sha256sum src/test/performance/windows-measure*.c \
                      build/test-results/windows-measurement/*.exe \
                      > build/test-results/windows-measurement/SHA256SUMS
            - name: Prove native Windows process-tree accounting and failure controls
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  python --version
                  python src/test/performance/test-windows-measurement.py `
                      build/test-results/windows-measurement/windows-measure.exe `
                      build/test-results/windows-measurement/payload.exe `
                      build/test-results/windows-measurement
                  if ($LASTEXITCODE -ne 0) { throw 'native accounting controls failed' }
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: windows-performance-measurement-controls
                  path: build/test-results/windows-measurement/
                  if-no-files-found: error
                  retention-days: 14

    corpus:
        runs-on: ubuntu-24.04
        timeout-minutes: 50
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  ref: ${{ env.PERFORMANCE_HEAD }}
            - name: Install source-build tools
              run: |
                  sudo apt-get update -y
                  sudo apt-get install --no-install-recommends -y build-essential bison flex m4 \
                      swig bc python3-dev python3-setuptools libssl-dev efitools curl
            - name: Build shared pinned ELF corpus and retain corresponding source
              run: python3 src/test/performance/prepare-host-corpus.py build/performance-corpus
            - uses: actions/upload-artifact@v7
              with:
                  name: performance-corpus
                  path: build/performance-corpus/
                  if-no-files-found: error
                  retention-days: 14
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: performance-corpus-failure
                  path: |
                      build/performance-corpus/build-evidence/
                      build/performance-corpus-uboot-build/run.*/*.log
                      build/performance-corpus-uboot-build/run.*/*.stderr
                      build/performance-corpus-uboot-build/run.*/*.json
                  retention-days: 14

    packages:
        runs-on: ubuntu-24.04
        timeout-minutes: 70
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  ref: ${{ env.PERFORMANCE_HEAD }}
            - name: Fetch exact-head CI artifacts without rebuilding production natives
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  python3 src/test/performance/fetch-ci-packages.py \
                      "$PERFORMANCE_HEAD" "$PERFORMANCE_BASELINE" build/performance-packages
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: performance-packages
                  path: build/performance-packages/
                  if-no-files-found: error
                  retention-days: 14

    windows-workloads:
        needs: [windows-measurement, corpus, packages]
        runs-on: windows-2025
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  ref: ${{ env.PERFORMANCE_HEAD }}
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '21'
            - uses: msys2/setup-msys2@v2
              id: msys2
              with:
                  msystem: MINGW64
                  update: true
                  install: mingw-w64-x86_64-binutils mingw-w64-x86_64-llvm
            - uses: actions/download-artifact@v8
              with:
                  name: windows-performance-measurement-controls
                  path: measurement
            - uses: actions/download-artifact@v8
              with:
                  name: performance-corpus
                  path: corpus
            - uses: actions/download-artifact@v8
              with:
                  name: performance-packages
                  path: packages
            - uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}\ghidra-download\${{ env.GHIDRA_ARCHIVE }}
                  key: ghidra-windows-${{ env.GHIDRA_ARCHIVE_SHA256 }}
            - name: Install isolated baseline and candidate packages
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $download = Join-Path $env:RUNNER_TEMP 'ghidra-download'
                  New-Item -ItemType Directory -Force $download | Out-Null
                  $archive = Join-Path $download $env:GHIDRA_ARCHIVE
                  if (-not (Test-Path $archive)) {
                      Invoke-WebRequest -Uri $env:GHIDRA_DOWNLOAD_URL -OutFile $archive
                  }
                  if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GHIDRA_ARCHIVE_SHA256) {
                      throw 'Ghidra archive hash mismatch'
                  }
                  foreach ($role in @('baseline', 'candidate')) {
                      $destination = Join-Path $env:RUNNER_TEMP "performance-$role"
                      Expand-Archive $archive -DestinationPath $destination
                      $ghidra = Join-Path $destination 'ghidra_12.0.3_PUBLIC'
                      # launch.bat does not print the selected JVM version by
                      # default. Observe the real Ghidra JVM, not a separate
                      # PATH java process, in both measured installations.
                      $launchProperties = Join-Path $ghidra 'support/launch.properties'
                      $configuration = Get-Content -Raw $launchProperties
                      $javaOverride = 'JAVA_HOME_OVERRIDE=' + $env:JAVA_HOME.Replace('\', '/')
                      $configuration = $configuration -replace '(?m)^JAVA_HOME_OVERRIDE=.*$', $javaOverride
                      $configuration += "`nVMARGS=-showversion`n"
                      [IO.File]::WriteAllText($launchProperties, $configuration, [Text.UTF8Encoding]::new($false))
                      $extensions = @(Get-ChildItem "packages/$role" -Filter '*.zip')
                      if ($extensions.Count -ne 1) { throw "ambiguous $role extension" }
                      Expand-Archive $extensions[0].FullName -DestinationPath (Join-Path $ghidra 'Ghidra/Extensions')
                      "PERFORMANCE_$($role.ToUpperInvariant())_DIR=$ghidra" | Out-File $env:GITHUB_ENV -Append
                  }
            - name: Measure actual Windows imports, paired exports, phases and validators
              shell: pwsh
              env:
                  MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
              run: |
                  $ErrorActionPreference = 'Stop'
                  $env:PATH = "$(Join-Path $env:MSYS2_LOCATION 'mingw64/bin');$env:PATH"
                  $env:DWARFDUMP = (Resolve-Path 'packages/checker-windows/libexec/dwarfdump.exe').Path
                  python src/test/performance/windows-workloads.py corpus `
                      $env:PERFORMANCE_BASELINE_DIR $env:PERFORMANCE_CANDIDATE_DIR `
                      measurement/windows-measure.exe build/test-results/windows-workloads --pairs 5 `
                      --checker-configuration packages/checker-windows/share/dwarfdump/dwarfdump.conf
                  if ($LASTEXITCODE -ne 0) { throw 'Windows workload measurement/validation failed' }
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: windows-performance-workloads
                  path: build/test-results/windows-workloads/
                  if-no-files-found: error
                  retention-days: 14

    windows-consumer:
        needs: [windows-workloads]
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  ref: ${{ env.PERFORMANCE_HEAD }}
            - uses: actions/download-artifact@v8
              with:
                  name: performance-corpus
                  path: corpus
            - uses: actions/download-artifact@v8
              with:
                  name: performance-packages
                  path: packages
            - uses: actions/download-artifact@v8
              with:
                  name: windows-performance-workloads
                  path: windows-workloads
            - name: Install independent Linux consumers
              run: |
                  sudo apt-get update -y
                  sudo apt-get install --no-install-recommends -y gdb-multiarch binutils llvm
            - name: Validate untouched Windows artifacts and exercise Linux GDB
              run: |
                  chmod +x packages/checker-linux/bin/dwarfdump packages/checker-linux/libexec/dwarfdump
                  export DWARFDUMP="$PWD/packages/checker-linux/bin/dwarfdump"
                  python3 src/test/performance/host-consumer.py corpus windows-workloads \
                      build/test-results/windows-performance-consumer
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: windows-performance-consumer
                  path: build/test-results/windows-performance-consumer/
                  if-no-files-found: error
                  retention-days: 14
