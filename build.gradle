    description = "Checks explicit class/type identities, stale records, cancellation and immutable reopen"
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "ghidradwarfforge.ClassBindingEvidenceSmoke"
    args ghidraInstallDir
    systemProperty "java.awt.headless", "true"
    systemProperty "application.settingsdir", file("build/tmp/class-binding/settings").absolutePath
    systemProperty "application.cachedir", file("build/tmp/class-binding/cache").absolutePath
}

