// Keep repository-only development inputs out of releases.
buildExtension {
    eachFile { details ->
        if (details.path in ["GhidraDwarfForge/support/ghidra-dwarf-forge-headless",
                "GhidraDwarfForge/support/ghidra-dwarf-forge-attach",
                "GhidraDwarfForge/support/ghidra-dwarf-forge-build-id"]) {
            details.permissions { permissions ->
                permissions.unix("rwxr-xr-x")
            }
        }
    }
    exclude ".github/**"
    exclude ".forge-work/**"
    exclude ".ghidra-test/**"
    exclude ".gitignore"
    exclude "AGENTS.md"
    exclude "PROJECT_CONTEXT.md"
    exclude "TODO.md"
    exclude "README.md"
    exclude "gradle/**"
    // Also exclude ignored leftovers in developer worktrees after legacy cleanup.
    exclude "jna-wrapper/**"
    exclude "settings.gradle"
}

