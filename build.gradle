    doFirst {
        def required = ["libdwarfPath", "libdwarfpPath", "sidecarInput", "sidecarOutput"]
        def missing = required.findAll { !project.hasProperty(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing Gradle properties: " + missing.join(", "))
