    jvmArgs "--enable-native-access=ALL-UNNAMED"
    if (project.hasProperty("nativeIterations")) {
        systemProperty "ghidradwarfforge.nativeSmokeIterations",
            project.property("nativeIterations")
    }

    doFirst {
        def required = ["packagedModuleRoot", "packagedPlatform", "targetProfile"]
        def missing = required.findAll { !project.hasProperty(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing Gradle properties: " + missing.join(", "))
        }
        args required.collect { project.property(it) }
    }
}

