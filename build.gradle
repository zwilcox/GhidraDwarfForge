/*
 * Builds GhidraDwarfForge as an external Ghidra extension.
 *
 * Supply GHIDRA_INSTALL_DIR as an environment variable or Gradle property.
 */
def ghidraInstallDir

if (System.env.GHIDRA_INSTALL_DIR) {
    ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
}
else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
    ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}
else {
    throw new GradleException("Set GHIDRA_INSTALL_DIR to a Ghidra 12.0.3 installation")
}

task distributeExtension {
    group = "Ghidra"
    apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"
    dependsOn ":buildExtension"
}

tasks.register("nativeProducerSmoke", JavaExec) {
    group = "verification"
    description = "Runs the libdwarf producer ABI smoke test in an isolated JVM"
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "ghidradwarfforge.nativeapi.DwarfProducerSmoke"
    jvmArgs "--enable-native-access=ALL-UNNAMED"
    if (project.hasProperty("nativeIterations")) {
        systemProperty "ghidradwarfforge.nativeSmokeIterations",
            project.property("nativeIterations")
    }

    doFirst {
        if (!project.hasProperty("libdwarfPath") ||
                !project.hasProperty("libdwarfpPath")) {
            throw new GradleException(
                "Set -PlibdwarfPath=<absolute path> and -PlibdwarfpPath=<absolute path>")
        }
        args project.property("libdwarfPath"), project.property("libdwarfpPath"),
            project.findProperty("targetProfile") ?: "x86_64"
        def sidecarProperties = ["sidecarInput", "sidecarOutput", "functionAddress"]
        def configuredSidecarProperties = sidecarProperties.findAll {
            project.hasProperty(it)
        }
        if (!configuredSidecarProperties.isEmpty() &&
                configuredSidecarProperties.size() != sidecarProperties.size()) {
            throw new GradleException(
                "Set all of -PsidecarInput, -PsidecarOutput, and -PfunctionAddress")
        }
        if (configuredSidecarProperties.size() == sidecarProperties.size()) {
            args sidecarProperties.collect { project.property(it) }
        }
    }
}

