tasks.register("classScopeSmoke", JavaExec) {
    group = "verification"
    description = "Checks class ownership fixture; optionally runs the isolated producer"
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "ghidradwarfforge.nativeapi.ClassScopeSmoke"
    jvmArgs "--enable-native-access=ALL-UNNAMED"
    doFirst {
        if (project.hasProperty("sidecarInput")) {
            setArgs(["libdwarfPath", "libdwarfpPath", "sidecarInput", "sidecarOutput", "functionAddress", "functionSize"].collect {
                project.property(it)
            })
        }
    }
}

