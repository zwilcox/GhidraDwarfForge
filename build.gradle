// Keep repository-only development inputs out of releases.
buildExtension {
    eachFile { details ->
        if (details.path == "GhidraDwarfForge/support/ghidra-dwarf-forge-headless") {
            details.permissions { permissions ->
                permissions.unix("rwxr-xr-x")
            }
        }
    }
    exclude ".github/**"
    exclude ".ghidra-test/**"
    exclude ".gitignore"
    exclude "AGENTS.md"
    exclude "PROJECT_CONTEXT.md"
    exclude "TODO.md"
    exclude "README.md"
    exclude "gradle/**"
    // Also exclude ignored leftovers in developer worktrees after legacy cleanup.
    exclude "jna-wrapper/**"
    exclude "settings.gradle"
}

